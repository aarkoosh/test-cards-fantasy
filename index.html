function drawTierBadge(ctx, tier, cx, cy, radius) {
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(28, 16, 42, 0.92)';
  ctx.fill();
  ctx.strokeStyle = '#b07cff';
  ctx.lineWidth = Math.max(3, Math.round(radius * 0.12));
  ctx.stroke();
  ctx.fillStyle = '#d2a8ff';
  ctx.font = `bold ${Math.round(radius * 1.15)}px Cinzel, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(tier ?? 1), cx, cy + 1);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function buildSquareBoardTexture(card, opts = {}) {
  const canvas2d = document.createElement('canvas');
  canvas2d.width = 512;
  canvas2d.height = 512;
  const ctx = canvas2d.getContext('2d');
  const frozenShop = !!opts.frozenShop;
  const spell = isSpell(card);
  const frameHex = frameColors(card, opts);
  ctx.fillStyle = frameHex;
  ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = spell ? '#101828' : '#120e18';
  roundRect(ctx, 16, 16, 480, 480, 28);
  ctx.fill();
  if (spell) {
    const spellBg = ctx.createRadialGradient(256, 220, 40, 256, 240, 280);
    spellBg.addColorStop(0, '#2a3f66');
    spellBg.addColorStop(0.55, '#172438');
    spellBg.addColorStop(1, '#101828');
    ctx.fillStyle = spellBg;
    roundRect(ctx, 28, 28, 456, 456, 22);
    ctx.fill();
    ctx.strokeStyle = frozenShop ? '#6ec6ff' : '#8eb7ff';
    ctx.lineWidth = 4;
    roundRect(ctx, 28, 28, 456, 456, 22);
    ctx.stroke();
    ctx.fillStyle = 'rgba(159,216,255,0.16)';
    ctx.beginPath();
    ctx.moveTo(256, 120);
    ctx.lineTo(320, 220);
    ctx.lineTo(256, 320);
    ctx.lineTo(192, 220);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(159,216,255,0.45)';
    ctx.lineWidth = 3;
    ctx.stroke();
  } else {
    const artImg = textures[card.art]?.image || textures[ART_A]?.image;
    ctx.save();
    roundRect(ctx, 28, 28, 456, 456, 22);
    ctx.clip();
    if (artImg && artImg.width) {
      const scale = Math.max(456 / artImg.width, 456 / artImg.height);
      const w = artImg.width * scale;
      const h = artImg.height * scale;
      ctx.drawImage(artImg, 28 + (456 - w) / 2, 28 + (456 - h) / 2, w, h);
      if (frozenShop) {
        ctx.fillStyle = 'rgba(110,198,255,0.22)';
        ctx.fillRect(28, 28, 456, 456);
      }
    } else {
      ctx.fillStyle = '#2a3344';
      ctx.fillRect(28, 28, 456, 456);
    }
    ctx.restore();
    ctx.strokeStyle = card.golden ? '#ffd978' : 'rgba(212,175,90,0.55)';
    ctx.lineWidth = 4;
    roundRect(ctx, 28, 28, 456, 456, 22);
    ctx.stroke();
    if (card.divineShield || hasKeyword(card, 'DivineShield')) {
      ctx.beginPath();
      ctx.strokeStyle = '#ffe08a';
      ctx.lineWidth = 8;
      roundRect(ctx, 10, 10, 492, 492, 30);

  }
  drawTierBadge(ctx, card.tier, 56, 56, 34);
  if (spell) {
    const cost = Number.isFinite(card.cost) ? card.cost : 0;

    grad.addColorStop(0.55, 'rgba(10,12,18,0.45)');
    grad.addColorStop(1, 'rgba(10,12,18,0.88)');
    ctx.fillStyle = grad;
    ctx.fillRect(28, 360, 456, 140);
    ctx.beginPath();
    ctx.arc(256, 430, 48, 0, Math.PI * 2);
    ctx.fillStyle = '#2a3a5c';
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#e0b85a';
    ctx.stroke();

    grad.addColorStop(0.55, 'rgba(10,12,18,0.45)');

    ctx.lineWidth = 5;

    ctx.strokeStyle = '#7dcea0';

const cardTextureCache = new Map();

function cardTextureKey(card, opts = {}) {
  const artImg = textures[card.art]?.image;
  return [
    card.name,
    String(card.tier),
    String(card.attack),
    String(card.health),
    String(isSpell(card) ? card.cost : ''),
    isSpell(card) ? (card.text || '') : '',
    card.golden ? 1 : 0,
    card.divineShield ? 1 : 0,
    (card.keywords || []).join(','),
    card.art,
    artImg && artImg.width ? 1 : 0,
    opts.square ? 1 : 0,
    opts.frozenShop ? 1 : 0,
    opts.isSelected ? 1 : 0,
    opts.isAttacker ? 1 : 0
  ].join('|');
}

function buildCardFrontTexture(card, opts = {}) {
  const key = cardTextureKey(card, opts);
  let tex = cardTextureCache.get(key);
  if (tex) return tex;
  tex = buildCardFrontTextureRaw(card, opts);
  cardTextureCache.set(key, tex);
  return tex;
}

    ctx.strokeStyle = card.golden ? '#ffd978' : 'rgba(212,175,90,0.55)';
    ctx.lineWidth = 4;
    roundRect(ctx, 36, 36, 440, 360, 18);
    ctx.stroke();
    ctx.fillStyle = 'rgba(10,12,18,0.92)';
    roundRect(ctx, 36, 410, 440, 270, 18);
    ctx.fill();
    ctx.fillStyle = card.golden ? '#ffd978' : '#e0b85a';
    ctx.font = 'bold 36px Cinzel, serif';
    const name = card.name.length > 20 ? card.name.slice(0, 19) + '…' : card.name;
    ctx.fillText(name, 56, 460);
    ctx.fillStyle = '#b9a888';
    ctx.font = 'bold 24px Source Sans 3, sans-serif';
    ctx.fillText(card.tribe, 56, 500);
    const kws = (card.keywords || []).map(keywordLabel);
    if (kws.length) {
      ctx.fillStyle = '#9fd8ff';
      ctx.font = 'bold 22px Source Sans 3, sans-serif';
      ctx.fillText(kws.join(' · '), 56, 536);
    }
    ctx.beginPath();
    ctx.arc(90, 620, 48, 0, Math.PI * 2);
    ctx.fillStyle = '#5a2a1a';
    ctx.fill();
    ctx.strokeStyle = '#e0b85a';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = '#fff4d8';
    ctx.font = 'bold 44px Source Sans 3, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(card.attack), 90, 622);
    ctx.beginPath();
    ctx.arc(422, 620, 48, 0, Math.PI * 2);
    ctx.fillStyle = '#1a3a2a';
    ctx.fill();
    ctx.strokeStyle = '#7dcea0';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = '#e8fff2';
    ctx.fillText(String(card.health), 422, 622);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    if (card.divineShield || hasKeyword(card, 'DivineShield')) {
      ctx.strokeStyle = '#ffe08a';
      ctx.lineWidth = 8;
      roundRect(ctx, 12, 12, 488, 692, 32);
      ctx.stroke();
    }
    if (card.golden) {
      ctx.fillStyle = '#ffd978';
      ctx.font = 'bold 20px Cinzel, serif';
      ctx.fillText('GOLDEN', 56, 660);
    }
  }
  drawTierBadge(ctx, card.tier, 62, 62, 38);
  const tex = new THREE.CanvasTexture(canvas2d);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function wrapText(ctx, text, maxWidth) {
  const words = String(text).split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? `${line} ${word}` : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

let cardBackTexture = null;
function getCardBackTexture() {
  if (cardBackTexture) return cardBackTexture;
  const canvas2d = document.createElement('canvas');
  canvas2d.width = 512;
  canvas2d.height = 716;
  const ctx = canvas2d.getContext('2d');
  const bg = ctx.createLinearGradient(0, 0, 512, 716);
  bg.addColorStop(0, '#1a2438');
  bg.addColorStop(0.5, '#121826');
  bg.addColorStop(1, '#0c1018');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 512, 716);
  ctx.strokeStyle = 'rgba(212,175,90,0.7)';
  ctx.lineWidth = 10;
  roundRect(ctx, 22, 22, 468, 672, 32);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(212,175,90,0.35)';
  ctx.lineWidth = 4;
  roundRect(ctx, 48, 48, 416, 620, 24);
  ctx.stroke();
  for (let i = 0; i < 7; i++) {
    ctx.strokeStyle = `rgba(212,175,90,${0.08 + (i % 2) * 0.06})`;
    ctx.lineWidth = 2;
    roundRect(ctx, 70 + i * 8, 70 + i * 10, 372 - i * 16, 576 - i * 20, 18);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(224,184,90,0.16)';
  ctx.beginPath();
  ctx.moveTo(256, 160);
  ctx.lineTo(330, 260);
  ctx.lineTo(256, 360);
  ctx.lineTo(182, 260);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(224,184,90,0.55)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#e0b85a';
  ctx.font = 'bold 54px Cinzel, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('FB', 256, 260);
  ctx.fillStyle = '#b9a888';
  ctx.font = 'bold 22px Cinzel, serif';
  ctx.fillText('FLAG', 256, 520);
  ctx.fillText('BEARER', 256, 552);
  cardBackTexture = new THREE.CanvasTexture(canvas2d);
  cardBackTexture.colorSpace = THREE.SRGBColorSpace;
  cardBackTexture.anisotropy = 4;
  return cardBackTexture;
}

function makeCardMesh(card, zone, index, opts = {}) {
  const group = new THREE.Group();
  const faceDown = !!opts.faceDown;
  const isSelected = !faceDown && selected && selected.minion && selected.minion.instanceId === card.instanceId;
  const isAttacker = opts.attackerId && opts.attackerId === card.instanceId;
  const frozenShop = !!opts.frozenShop;
  const square = isShortCardZone(zone);
  const { w, h } = cardSizeForZone(zone);
  let edgeColor = isSpell(card) ? 0x2a3a5c : 0x3a2f1c;
  if (card.golden) edgeColor = 0xd4af37;
  if (frozenShop) edgeColor = 0x6ec6ff;
  if (isSelected) edgeColor = 0x7ad0ff;
  if (isAttacker) edgeColor = 0xff6b5a;
  if (faceDown) edgeColor = 0x2a3348;
  const frontTex = faceDown ? getCardBackTexture() : buildCardFrontTexture(card, { frozenShop, isSelected, isAttacker, square });
  const edgeMat = new THREE.MeshStandardMaterial({
    color: edgeColor,
    roughness: 0.45,
    metalness: card.golden && !faceDown ? 0.55 : 0.2
  });
  const frontMat = new THREE.MeshStandardMaterial({
    map: frontTex,
    roughness: faceDown ? 0.55 : 0.42,
    metalness: faceDown ? 0.12 : (card.golden ? 0.28 : 0.08)
  });
  const backMat = new THREE.MeshStandardMaterial({
    map: faceDown ? null : getCardBackTexture(),
    color: faceDown ? 0x1a1424 : 0xffffff,
    roughness: 0.7,
    metalness: 0.05
  });
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, CARD_D),
    [edgeMat, edgeMat, edgeMat, edgeMat, frontMat, backMat]
  );
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);
  if (isSelected || isAttacker) {
    const glow = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.16, h + 0.16, CARD_D + 0.02),
      new THREE.MeshBasicMaterial({
        color: isAttacker ? 0xff4020 : 0x4aa8ff,
        transparent: true,
        opacity: 0.22,
        depthWrite: false
      })
    );
    glow.position.z = -0.01;
    group.add(glow);
  }
  group.userData = { minion: card, zone, index, cardW: w, cardH: h, faceDown };
  return group;
}

function layoutRow(items, z, y, spacing, rotX = -0.68) {
  const start = -((items.length - 1) * spacing) / 2;
  items.forEach((mesh, i) => {
    const x = start + i * spacing;
    mesh.position.set(x, y, z);
    mesh.rotation.x = rotX;
    mesh.rotation.y = 0;
    mesh.rotation.z = 0;
    mesh.userData.baseX = x;
    mesh.userData.baseY = y;
    mesh.userData.baseZ = z;
    mesh.userData.baseRotX = rotX;
    mesh.userData.baseRotY = 0;
  });
}

function clearCardHover() {
  if (hoveredCard && hoveredCard.userData.zone !== 'hand') {
    hoveredCard.rotation.x = hoveredCard.userData.baseRotX ?? hoveredCard.rotation.x;
    hoveredCard.rotation.y = hoveredCard.userData.baseRotY ?? 0;
    hoveredCard.position.y = hoveredCard.userData.baseY ?? hoveredCard.position.y;
    hoveredCard.position.z = hoveredCard.userData.baseZ ?? hoveredCard.position.z;
  }
  hoveredCard = null;
  hideCardTooltip();
}

function applyCardHoverTilt(card, point) {
  if (card.userData.zone === 'hand') return;
  const local = card.worldToLocal(point.clone());
  const halfW = (card.userData.cardW || CARD_W) * 0.5;
  const halfH = (card.userData.cardH || CARD_H) * 0.5;
  const tiltY = clamp(local.x / halfW, -1, 1) * 0.22;
  const tiltX = clamp(-local.y / halfH, -1, 1) * 0.14;
  card.rotation.x = (card.userData.baseRotX ?? -0.68) + tiltX;
  card.rotation.y = tiltY;
  card.position.y = (card.userData.baseY ?? card.position.y) + 0.18;
}

const handOverlayCenter = new THREE.Vector3();
const handOverlayEdge = new THREE.Vector3();
const handOverlayProj = new THREE.Vector3();
const handOverlayQuat = new THREE.Quaternion();
const handOverlayParentQuat = new THREE.Quaternion();

function setHandMeshHiddenForOverlay(group, hidden) {
  const body = group?.children?.[0];
  if (!body?.material) return;
  const mats = Array.isArray(body.material) ? body.material : [body.material];
  for (const mat of mats) {
    if (!mat) continue;
    mat.transparent = true;
    mat.opacity = hidden ? 0 : 1;
    mat.depthWrite = !hidden;
  }
  for (let i = 1; i < group.children.length; i++) {
    group.children[i].visible = !hidden;
  }
}

function projectWorldPointToScreen(v) {
  handOverlayProj.copy(v).project(camera);
  return {
    x: (handOverlayProj.x * 0.5 + 0.5) * window.innerWidth,
    y: (-handOverlayProj.y * 0.5 + 0.5) * window.innerHeight
  };
}

function measureHandCardScreenSize(baseX, baseY, baseZ, baseRotX, cardW, cardH, parent) {
  const halfW = cardW * 0.5;
  const halfH = cardH * 0.5;
  handOverlayCenter.set(baseX, baseY, baseZ);
  if (parent) parent.localToWorld(handOverlayCenter);
  handOverlayQuat.setFromEuler(new THREE.Euler(baseRotX, 0, 0, 'XYZ'));
  if (parent) {
    parent.getWorldQuaternion(handOverlayParentQuat);
    handOverlayQuat.premultiply(handOverlayParentQuat);
  }
  const origin = projectWorldPointToScreen(handOverlayCenter);
  handOverlayEdge.set(halfW, 0, 0).applyQuaternion(handOverlayQuat).add(handOverlayCenter);
  const right = projectWorldPointToScreen(handOverlayEdge);
  handOverlayEdge.set(0, halfH, 0).applyQuaternion(handOverlayQuat).add(handOverlayCenter);
  const top = projectWorldPointToScreen(handOverlayEdge);
  const screenW = Math.max(36, Math.hypot(right.x - origin.x, right.y - origin.y) * 2);
  const screenH = Math.max(50, Math.hypot(top.x - origin.x, top.y - origin.y) * 2);
  return {
    cx: origin.x,
    cy: origin.y,
    left: origin.x - screenW * 0.5,
    right: origin.x + screenW * 0.5,
    top: origin.y - screenH * 0.5,
    bottom: origin.y + screenH * 0.5,
    width: screenW,
    height: screenH
  };
}

function getHandCardBaseScreenRect(mesh) {
  return measureHandCardScreenSize(
    mesh.userData.baseX ?? mesh.position.x,
    mesh.userData.baseY ?? HAND_ROW_Y,
    mesh.userData.baseZ ?? HAND_ROW_Z,
    mesh.userData.baseRotX ?? HAND_ROW_ROTX,
    mesh.userData.cardW || HAND_W,
    mesh.userData.cardH || HAND_H,
    mesh.parent
  );
}

function getPlayerHandCardScreenSize() {
  const mesh = cardMeshes.find(m => m.userData.zone === 'hand');
  if (mesh) return getHandCardBaseScreenRect(mesh);
  return measureHandCardScreenSize(0, HAND_ROW_Y, HAND_ROW_Z, HAND_ROW_ROTX, HAND_W, HAND_H, cardGroup);
}

function findHandCardAtPointer(clientX, clientY) {
  let best = null;
  let bestDx = Infinity;
  for (const mesh of cardMeshes) {
    if (mesh.userData.zone !== 'hand') continue;
    const rect = getHandCardBaseScreenRect(mesh);
    const hitH = rect.height * 0.7;
    const top = rect.cy - hitH * 0.5;
    const bottom = rect.cy + hitH * 0.5;
    if (clientY < top || clientY > bottom) continue;
    const dx = Math.abs(clientX - rect.cx);
    if (dx < bestDx) {
      bestDx = dx;
      best = { mesh, halfW: rect.width * 0.42 };
    }
  }
  if (!best || bestDx > best.halfW) return null;
  return best.mesh;
}

function handCardArtKey(minion, isSelected) {
  return [
    minion.instanceId,
    minion.attack,
    minion.health,
    minion.cost,
    minion.golden ? 1 : 0,
    isSelected ? 1 : 0,
    (minion.keywords || []).join(',')
  ].join('|');
}

function rectsOverlap(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

function syncPortraitHandBlocking() {
  const layer = document.getElementById('handOverlay');
  const nodes = [
    document.querySelector('#playerPortraitSlot .playerSide'),
    document.getElementById('playerHeroFrame')
  ];
  for (const node of nodes) {
    if (!node) continue;
    if (!layer || !layer.classList.contains('show') || !layer.children.length) {
      node.style.pointerEvents = 'auto';
      continue;
    }
    const nr = node.getBoundingClientRect();
    let overlap = false;
    for (const el of layer.children) {
      if (rectsOverlap(nr, el.getBoundingClientRect())) {
        overlap = true;
        break;
      }
    }
    node.style.pointerEvents = overlap ? 'none' : 'auto';
  }
}

function hideHandOverlay() {
  const layer = document.getElementById('handOverlay');
  if (layer) {
    layer.classList.remove('show');
    layer.innerHTML = '';
  }
  for (const mesh of cardMeshes) {
    if (mesh.userData.zone === 'hand') setHandMeshHiddenForOverlay(mesh, false);
  }
  syncPortraitHandBlocking();
}

function hideEnemyHandOverlay() {
  const layer = document.getElementById('enemyHandOverlay');
  if (layer) {
    layer.classList.remove('show');
    layer.innerHTML = '';
  }
}

function syncEnemyHandOverlay(cards) {
  const layer = document.getElementById('enemyHandOverlay');
  if (!layer) return;
  const list = cards || [];
  if (phase !== 'combat' || !list.length) {
    hideEnemyHandOverlay();
    return;
  }
  const size = getPlayerHandCardScreenSize();
  const overlap = size.width * (1 - HAND_ROW_SPACING / HAND_W);
  layer.style.setProperty('--enemy-hand-overlap', `${-overlap}px`);
  const portrait = document.getElementById('stagePortraitSlot');
  const portraitRect = portrait?.getBoundingClientRect();
  if (portraitRect && portraitRect.height > 0) {
    const gap = 10;
    const top = Math.max(6, portraitRect.top - size.height - gap);
    layer.style.left = `${portraitRect.left + portraitRect.width * 0.5}px`;
    layer.style.top = `${top}px`;
  } else {
    layer.style.left = '50%';
    layer.style.top = '10px';
  }
  layer.classList.add('show');
  while (layer.children.length < list.length) {
    const el = document.createElement('div');
    el.className = 'enemyHandOverlayCard';
    el.appendChild(document.createElement('canvas'));
    layer.appendChild(el);
  }
  while (layer.children.length > list.length) {
    layer.removeChild(layer.lastChild);
  }
  const back = getCardBackTexture().image;
  list.forEach((_, i) => {
    const el = layer.children[i];
    const canvas = el.firstChild;
    el.style.width = `${size.width}px`;
    el.style.height = `${size.height}px`;
    if (el.dataset.key !== 'back') {
      el.dataset.key = 'back';
      const ctx = canvas.getContext('2d');
      canvas.width = back.width;
      canvas.height = back.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(back, 0, 0);
    }
  });
}

function syncHandOverlayLayer() {
  const layer = document.getElementById('handOverlay');
  if (!layer) return;
  const uiHidden = document.getElementById('ui')?.classList.contains('hidden');
  const handMeshes = cardMeshes.filter(m => m.userData.zone === 'hand');
  if (uiHidden || !handMeshes.length) {
    hideHandOverlay();
    return;
  }
  layer.classList.add('show');
  while (layer.children.length < handMeshes.length) {
    const el = document.createElement('div');
    el.className = 'handOverlayCard';
    el.appendChild(document.createElement('canvas'));
    layer.appendChild(el);
  }
  while (layer.children.length > handMeshes.length) {
    layer.removeChild(layer.lastChild);
  }
  handMeshes.forEach((mesh, i) => {
    const el = layer.children[i];
    const canvas = el.firstChild;
    const minion = mesh.userData.minion;
    const isSelected = !!(selected && selected.minion && selected.minion.instanceId === minion.instanceId);
    const key = handCardArtKey(minion, isSelected);
    if (el.dataset.key !== key) {
      el.dataset.key = key;
      const tex = buildCardFrontTexture(minion, { isSelected, square: false });
      const src = tex.image;
      const ctx = canvas.getContext('2d');
      canvas.width = src.width;
      canvas.height = src.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(src, 0, 0);
    }
    const baseRect = getHandCardBaseScreenRect(mesh);
    mesh.getWorldPosition(handOverlayCenter);
    const center = projectWorldPointToScreen(handOverlayCenter);
    el.style.left = `${center.x}px`;
    el.style.top = `${center.y}px`;
    el.style.width = `${baseRect.width}px`;
    el.style.height = `${baseRect.height}px`;
    const hoverT = mesh.userData.hoverT ?? 0;
    el.classList.toggle('raised', hoverT > 0.2);
    el.style.zIndex = String(1 + Math.round(hoverT * 12));
    setHandMeshHiddenForOverlay(mesh, true);
  });
  syncPortraitHandBlocking();
}

function updateHandHoverAnimation() {
  const draggingId = dragState?.dragging ? dragState.instanceId : null;
  for (const mesh of cardMeshes) {
    if (mesh.userData.zone !== 'hand') continue;
    if (draggingId && mesh.userData.minion?.instanceId === draggingId) {
      mesh.userData.hoverT = 0;
      continue;
    }
    const raised = hoveredCard === mesh;
    const target = raised ? 1 : 0;
    const prev = mesh.userData.hoverT ?? 0;
    const next = prev + (target - prev) * 0.2;
    mesh.userData.hoverT = Math.abs(next - target) < 0.002 ? target : next;
    const t = mesh.userData.hoverT;
    const ease = t * t * (3 - 2 * t);
    if (!dragState?.dragging || mesh.userData.minion?.instanceId !== dragState.instanceId) {
      mesh.position.x = mesh.userData.baseX ?? mesh.position.x;
      mesh.position.y = (mesh.userData.baseY ?? HAND_ROW_Y) + ease * 0.7;
      mesh.position.z = (mesh.userData.baseZ ?? HAND_ROW_Z) - ease * 0.95;
      mesh.rotation.x = (mesh.userData.baseRotX ?? HAND_ROW_ROTX) + ease * 0.08;
      mesh.rotation.y = 0;
    }
  }
  syncHandOverlayLayer();
}

function renderHandRow(player, z = HAND_ROW_Z, y = HAND_ROW_Y) {
  const handMeshes = [];
  player.hand.forEach((m, i) => {
    const mesh = makeCardMesh(m, 'hand', i);
    handMeshes.push(mesh);
    cardMeshes.push(mesh);
    cardGroup.add(mesh);
  });
  layoutRow(handMeshes, z, y, HAND_ROW_SPACING, HAND_ROW_ROTX);
}

function renderEnemyHandRow(cards) {
  syncEnemyHandOverlay(cards);
}

function renderBoardRow(cards, zone, z, y, opts = {}) {
  const meshes = [];
  cards.forEach((m, i) => {
    const mesh = makeCardMesh(m, zone, i, opts);
    meshes.push(mesh);
    cardMeshes.push(mesh);
    cardGroup.add(mesh);
  });
  layoutRow(meshes, z, y, opts.spacing ?? BOARD_ROW_SPACING, opts.rotX ?? BOARD_ROW_ROTX);
}

function renderCards() {
  if (dragState?.dragging) return;
  clearCardHover();
  while (cardGroup.children.length) cardGroup.remove(cardGroup.children[0]);
  cardMeshes.length = 0;
  if (!state) return;
  const p = human();
  if (!p) return;
  if (phase === 'combat' && combatAnim) {
    const boardA = combatAnim.boardA || [];
    const boardB = combatAnim.boardB || [];
    const aIsYou = !!(combatAnim.a && (combatAnim.a.isHuman || combatAnim.a.id === p.id));
    const bIsYou = !!(combatAnim.b && (combatAnim.b.isHuman || combatAnim.b.id === p.id));
    let mine;
    let theirs;
    let foe = null;
    if (aIsYou) {
      mine = boardA;
      theirs = boardB;
      foe = combatAnim.b;
    } else if (bIsYou) {
      mine = boardB;
      theirs = boardA;
      foe = combatAnim.a;
    } else {
      mine = boardA;
      theirs = boardB;
      foe = combatAnim.b;
    }
    renderBoardRow(theirs, 'enemy', TAVERN_ROW_Z, TAVERN_ROW_Y, {
      attackerId: combatAnim.attackerId,
      spacing: TAVERN_ROW_SPACING,
      rotX: TAVERN_ROW_ROTX
    });
    renderBoardRow(mine, 'board', BOARD_ROW_Z, BOARD_ROW_Y, { attackerId: combatAnim.attackerId });
    renderHandRow(p);
    renderEnemyHandRow(foe?.hand || []);
    return;
  }
  hideEnemyHandOverlay();
  const shopMeshes = [];
  p.shop.forEach((m, i) => {
    if (!m) return;
    const mesh = makeCardMesh(m, 'shop', i, { frozenShop: p.frozen });
    shopMeshes.push(mesh);
    cardMeshes.push(mesh);
    cardGroup.add(mesh);
  });
  layoutRow(shopMeshes, TAVERN_ROW_Z, p.frozen ? TAVERN_ROW_Y_FROZEN : TAVERN_ROW_Y, TAVERN_ROW_SPACING, TAVERN_ROW_ROTX);
  renderBoardRow(p.board, 'board', BOARD_ROW_Z, BOARD_ROW_Y);
  renderHandRow(p);
}

let tooltipCardId = null;

function hideCardTooltip() {
  tooltipCardId = null;
  const tip = document.getElementById('cardTooltip');
  if (tip) tip.classList.remove('show');
}

function positionCardTooltip(clientX, clientY) {
  const tip = document.getElementById('cardTooltip');
  if (!tip || !tip.classList.contains('show')) return;
  const pad = 12;
  const tw = tip.offsetWidth || 210;
  const th = tip.offsetHeight || 294;
  let left = clientX - tw - 72;
  let top = clientY - th * 0.55;
  if (left < pad) left = pad;
  if (top < pad) top = pad;
  if (top + th > window.innerHeight - pad) top = window.innerHeight - th - pad;
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}

function showTooltipFor(minion, mesh, clientX, clientY) {
  const tip = document.getElementById('cardTooltip');
  if (!tip) return;
  if (!minion || !mesh || !isShortCardZone(mesh.userData.zone) || mesh.userData.faceDown) {
    hideCardTooltip();
    return;
  }
  const id = minion.instanceId;
  if (tooltipCardId !== id) {
    tooltipCardId = id;
    const frozenShop = mesh.userData.zone === 'shop' && !!human()?.frozen;
    const isSelected = !!(selected && selected.minion && selected.minion.instanceId === minion.instanceId);
    const tex = buildCardFrontTexture(minion, { frozenShop, isSelected, square: false });
    const src = tex.image;
    const canvas = document.getElementById('cardTooltipCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = src.width;
    canvas.height = src.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(src, 0, 0);
    tip.classList.add('show');
  }
  positionCardTooltip(clientX, clientY);
}

let dragState = null;
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const dragHit = new THREE.Vector3();

function resolveCardHit(hits) {
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && !(obj.userData && obj.userData.minion)) obj = obj.parent;
  return obj || null;
}

function clearSellTargetHighlight() {
  const bob = document.getElementById('tavernMasterFrame');
  bob.classList.remove('sellTarget', 'sellHot');
}

function isPointerOverBob(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  return !!(el && el.closest && el.closest('#tavernMasterFrame'));
}

function isPointerOverPlayerPortrait(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  return !!(el && el.closest && el.closest('#playerPortraitSlot'));
}

function isDropInHandBuyZone(mesh, clientX, clientY) {
  if (mesh && mesh.position.z >= 5.6) return true;
  if (isPointerOverPlayerPortrait(clientX, clientY)) return true;
  return false;
}

function isDropInBoardPlayZone(mesh) {
  if (!mesh) return false;
  const z = mesh.position.z;
  return z > -2.4 && z < 5.6;
}

function findDragMesh() {
  if (!dragState) return null;
  return cardMeshes.find(m => m.userData?.minion?.instanceId === dragState.instanceId) || null;
}

function resolveBoardDropIndex(clientX, clientY, draggedInstanceId, mesh, player) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(cardMeshes, true);
  for (const hit of hits) {
    let obj = hit.object;
    while (obj && !(obj.userData && obj.userData.minion)) obj = obj.parent;
    if (!obj) continue;
    if (obj.userData.minion?.instanceId === draggedInstanceId) continue;
    if (obj.userData.zone === 'board') return obj.userData.index;
  }
  if (mesh) {
    const targets = cardMeshes
      .filter(m => m.userData.zone === 'board' && m.userData.minion?.instanceId !== draggedInstanceId)
      .slice()
      .sort((a, b) => (a.userData.baseX ?? a.position.x) - (b.userData.baseX ?? b.position.x));
    if (!targets.length) return player.board.length;
    for (const target of targets) {
      const tx = target.userData.baseX ?? target.position.x;
      if (mesh.position.x < tx) return target.userData.index;
    }
    return targets[targets.length - 1].userData.index + 1;
  }
  return player.board.length;
}

function moveBoardCard(player, fromIndex, toIndex) {
  if (!player || fromIndex < 0 || fromIndex >= player.board.length) return false;
  const dest = clamp(toIndex, 0, player.board.length);
  if (dest === fromIndex || dest === fromIndex + 1) return false;
  const [card] = player.board.splice(fromIndex, 1);
  let insertAt = dest;
  if (insertAt > fromIndex) insertAt--;
  player.board.splice(insertAt, 0, card);
  return true;
}

function updateDragCardPosition(clientX, clientY) {
  const mesh = findDragMesh();
  if (!mesh) return;
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  dragPlane.constant = -(mesh.userData.baseY ?? 2);
  if (raycaster.ray.intersectPlane(dragPlane, dragHit)) {
    mesh.position.x = dragHit.x;
    mesh.position.z = dragHit.z;
    mesh.position.y = (mesh.userData.baseY ?? 2) + 0.45;
    mesh.rotation.x = mesh.userData.baseRotX ?? -0.64;
    mesh.rotation.y = 0;
  }
}

function endCardDrag(clientX, clientY) {
  if (!dragState) return;
  const p = human();
  const wasDragging = dragState.dragging;
  const zone = dragState.zone;
  const index = dragState.index;
  const minion = dragState.minion;
  const mesh = findDragMesh();
  clearSellTargetHighlight();
  dragState = null;
  if (wasDragging) {
    const inBuyZone = isDropInHandBuyZone(mesh, clientX, clientY);
    const inBoardZone = isDropInBoardPlayZone(mesh);
    if (mesh) {
      mesh.position.x = mesh.userData.baseX ?? mesh.position.x;
      mesh.position.y = mesh.userData.baseY ?? mesh.position.y;
      mesh.position.z = mesh.userData.baseZ ?? mesh.position.z;
      mesh.rotation.x = mesh.userData.baseRotX ?? mesh.rotation.x;
      mesh.rotation.y = mesh.userData.baseRotY ?? 0;
    }
    if (p && zone === 'shop') {
      const shopIdx = p.shop.findIndex(m => m && m.instanceId === minion.instanceId);
      if (shopIdx >= 0 && inBuyZone) {
        if (buyFromShop(p, shopIdx)) {
          log(isSpell(minion) ? `Bought spell ${minion.name} (${minion.cost} gold) into Hand.` : `Bought ${minion.name} into Hand.`);
          selected = null;
          syncUI();
          renderCards();
          return;
        }
      } else if (shopIdx >= 0) {
        logHint('Drag tavern cards into your Hand to buy.');
      }
      syncUI();
      renderCards();
      return;
    }
    if (p && (zone === 'hand' || zone === 'board') && isPointerOverBob(clientX, clientY)) {
      const arr = zone === 'board' ? p.board : p.hand;
      const idx = arr.findIndex(m => m && m.instanceId === minion.instanceId);
      if (idx >= 0 && sellMinion(p, zone, idx)) {
        log(`Sold ${minion.name} to Bartender Bob for 1 gold.`);
        selected = null;
        syncUI();
        renderCards();
        return;
      }
    }
    if (p && zone === 'hand' && inBoardZone) {
      const handIdx = p.hand.findIndex(m => m && m.instanceId === minion.instanceId);
      if (handIdx >= 0) {
        if (isSpell(minion)) {
          if (playSpell(p, handIdx)) {
            log(`Cast ${minion.name}.`);
            selected = null;
          }
          syncUI();
          renderCards();
          return;
        }
        const boardIndex = resolveBoardDropIndex(clientX, clientY, minion.instanceId, mesh, p);
        if (playMinion(p, handIdx, boardIndex)) selected = null;
        syncUI();
        renderCards();
        return;
      }
    }
    if (p && zone === 'board' && inBoardZone && !isPointerOverBob(clientX, clientY)) {
      const fromIdx = p.board.findIndex(m => m && m.instanceId === minion.instanceId);
      if (fromIdx >= 0) {
        const toIdx = resolveBoardDropIndex(clientX, clientY, minion.instanceId, mesh, p);
        if (moveBoardCard(p, fromIdx, toIdx)) {
          selected = null;
          log('Reordered board.');
        }
      }
      syncUI();
      renderCards();
      return;
    }
    if (p && zone === 'hand' && !isPointerOverBob(clientX, clientY) && !inBoardZone) {
      logHint(isSpell(minion) ? 'Drop on the Board to cast.' : 'Drop on the Board to play.');
    }
    if (p && zone === 'board' && !isPointerOverBob(clientX, clientY) && !inBoardZone) {
      logHint('Drop on the Board to reorder, or on Bob to sell.');
    }
    syncUI();
    renderCards();
    return;
  }
  handleCardClick(zone, index, minion);
}

function handleCardClick(zone, index, minion) {
  const p = human();
  if (!p || !p.alive) return;
  if (zone === 'shop') {
    logHint('Drag tavern cards into your Hand to buy.');
    return;
  } else if (zone === 'hand') {
    if (isSpell(minion)) {
      if (selected && selected.zone === 'hand' && selected.minion.instanceId === minion.instanceId) {
        if (playSpell(p, index)) {
          log(`Cast ${minion.name}.`);
          selected = null;
        }
      } else {
        selected = { zone: 'hand', index, minion };
        logHint('Click again to cast, or drag onto the Board.');
      }
    } else {
      selected = { zone: 'hand', index, minion };
      logHint('Drag onto the Board to play.');
    }
  } else if (zone === 'board') {
    selected = null;
    logHint('Drag on the Board to reorder.');
  }
  syncUI();
  renderCards();
}

function onPointerMove(e) {
  if (dragState) {
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (!dragState.dragging && Math.hypot(dx, dy) > 8) {
      dragState.dragging = true;
      clearCardHover();
      if (dragState.zone === 'shop') {
        logHint('Drop in your Hand to buy.');
      } else if (dragState.zone === 'hand') {
        document.getElementById('tavernMasterFrame').classList.add('sellTarget');
        logHint(isSpell(dragState.minion) ? 'Drop on Board to cast, or on Bob to sell.' : 'Drop on Board to play, or on Bob to sell.');
      } else if (dragState.zone === 'board') {
        document.getElementById('tavernMasterFrame').classList.add('sellTarget');
        logHint('Drop on the Board to reorder, or on Bob to sell.');
      } else {
        document.getElementById('tavernMasterFrame').classList.add('sellTarget');
        logHint('Drop on Bartender Bob to sell (+1 Gold).');
      }
    }
    if (dragState.dragging) {
      updateDragCardPosition(e.clientX, e.clientY);
      if (dragState.zone === 'hand' || dragState.zone === 'board') {
        document.getElementById('tavernMasterFrame').classList.toggle('sellHot', isPointerOverBob(e.clientX, e.clientY));
      }
      return;
    }
  }
  const handTarget = findHandCardAtPointer(e.clientX, e.clientY);
  let obj = handTarget;
  let hitPoint = null;
  if (!obj) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(cardMeshes, true);
    obj = resolveCardHit(hits);
    if (obj && obj.userData.zone === 'hand') obj = null;
    if (obj) hitPoint = hits[0].point;
  }
  if (!obj || obj.userData.faceDown || obj.userData.zone === 'enemyHand') {
    clearCardHover();
    return;
  }
  if (hoveredCard !== obj) {
    if (hoveredCard && hoveredCard.userData.zone !== 'hand') {
      hoveredCard.rotation.x = hoveredCard.userData.baseRotX ?? hoveredCard.rotation.x;
      hoveredCard.rotation.y = hoveredCard.userData.baseRotY ?? 0;
      hoveredCard.position.y = hoveredCard.userData.baseY ?? hoveredCard.position.y;
    }
    hideCardTooltip();
    hoveredCard = obj;
  }
  if (hitPoint) applyCardHoverTilt(obj, hitPoint);
  showTooltipFor(obj.userData.minion, obj, e.clientX, e.clientY);
}

function onPointerDown(e) {
  const you = human();
  if (phase !== 'recruit' || pendingDiscover || !you || !you.alive) return;
  if (e.button != null && e.button !== 0) return;
  let obj = findHandCardAtPointer(e.clientX, e.clientY);
  if (!obj) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(cardMeshes, true);
    obj = resolveCardHit(hits);
    if (obj && obj.userData.zone === 'hand') obj = findHandCardAtPointer(e.clientX, e.clientY);
  }
  if (!obj) { selected = null; syncUI(); renderCards(); return; }
  const { minion, zone, index } = obj.userData;
  if ((zone === 'hand' || zone === 'board' || zone === 'shop') && minion) {
    dragState = {
      zone,
      index,
      minion,
      instanceId: minion.instanceId,
      startX: e.clientX,
      startY: e.clientY,
      dragging: false
    };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  handleCardClick(zone, index, minion);
}

function onPointerUp(e) {
  if (!dragState) return;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  endCardDrag(e.clientX, e.clientY);
}

function showTitleScreen() {
  phase = 'title';
  setGameUiVisible(false);
  document.getElementById('overlay').classList.remove('hidden');
  const box = document.getElementById('overlayContent');
  box.innerHTML = `<h1 class="titleLogo">Flag Bearer</h1><button class="primary beginBtn" id="btnBegin">Begin</button>`;
  document.getElementById('btnBegin').onclick = () => startHeroDraft();
}

function startHeroDraft() {
  phase = 'draft';
  setGameUiVisible(false);
  document.getElementById('overlay').classList.remove('hidden');
  const heroes = HERO_DB.slice().sort(() => Math.random() - 0.5);
  const humanOptions = heroes.slice(0, 2);
  const box = document.getElementById('overlayContent');
  box.innerHTML = `<h1 class="chooseLord">Choose your Lord</h1><div class="heroGrid"></div>`;
  const grid = box.querySelector('.heroGrid');
  humanOptions.forEach(hero => {
    const el = document.createElement('div');
    el.className = 'heroCard';
    const art = heroPortraitArt(hero);
    el.innerHTML = `<img class="portrait" src="${art}" alt="${escapeHtml(hero.name)}"><h3>${escapeHtml(hero.name)}</h3><div class="meta">Armor ${hero.armor}</div><div class="power"><strong>${escapeHtml(hero.power.name)}</strong> (${hero.power.cost} Gold)<br>${escapeHtml(hero.power.text)}</div>`;
    el.onclick = () => beginMatch(hero, heroes);
    grid.appendChild(el);
  });
}

function beginMatch(humanHero, allHeroes) {
  const players = [];
  players.push(createPlayer(humanHero, true, 0));
  const remaining = allHeroes.filter(h => h.id !== humanHero.id).sort(() => Math.random() - 0.5);
  for (let i = 0; i < 7; i++) {
    const options = remaining.splice(0, 2);
    const pool = options.length ? options : HERO_DB.filter(h => !players.some(p => p.hero.id === h.id)).slice(0, 2);
    players.push(createPlayer(aiChooseHero(pool.length ? pool : HERO_DB), false, i + 1));
  }
  state = {
    players,
    pool: buildPool(),
    turn: 1
  };
  discoverQueue = [];
  pendingDiscover = null;
  selected = null;
  logs.length = 0;
  setHistoryOpen(false);
  closeCodex();
  renderHistoryPanel();
  document.getElementById('overlay').classList.add('hidden');
  setGameUiVisible(true);
  log('Match started. Buy minions, upgrade your tavern, and survive.');
  beginRecruitPhase();
}

document.getElementById('btnRefresh').onclick = () => {
  const p = human();
  if (p.gold < REFRESH_COST) { log('Not enough gold to refresh.'); return; }
  if (refreshShop(p)) { log('Refreshed the Tavern.'); syncUI(); renderCards(); }
};
document.getElementById('btnUpgrade').onclick = () => {
  const p = human();
  if (p.tavernTier >= 6) { log('Already at max tavern tier.'); return; }
  if (p.gold < p.upgradeCost) { log(`Need ${p.upgradeCost} gold to upgrade.`); return; }
  if (upgradeTavern(p)) { syncUI(); renderCards(); }
};
document.getElementById('btnFreeze').onclick = () => {
  const p = human();
  p.frozen = !p.frozen;
  log(p.frozen ? 'Tavern frozen for next turn.' : 'Tavern unfrozen.');
  syncUI();
  renderCards();
};
document.getElementById('btnHeroPower').onclick = () => {
  const p = human();
  if (p.heroPowerUses <= 0) { log('Lord power already used.'); return; }
  if (p.gold < p.hero.power.cost) { log('Not enough gold for Lord power.'); return; }
  if (useHeroPower(p)) { syncUI(); renderCards(); }
};
const heroPowerBtn = document.getElementById('btnHeroPower');
heroPowerBtn.addEventListener('mouseenter', (e) => showHeroPowerHover(e.clientX, e.clientY));
heroPowerBtn.addEventListener('mousemove', (e) => {
  if (document.getElementById('oppHover').classList.contains('show')) positionOppHover(e.clientX, e.clientY);
});
heroPowerBtn.addEventListener('mouseleave', () => hideOppHover());
document.getElementById('btnHistory').onclick = () => setHistoryOpen(!historyOpen);
const playerHeroFrame = document.getElementById('playerHeroFrame');
playerHeroFrame.addEventListener('mouseenter', (e) => showPlayerHeroFrameHover(e.clientX, e.clientY));
playerHeroFrame.addEventListener('mousemove', (e) => {
  if (document.getElementById('oppHover').classList.contains('show')) positionOppHover(e.clientX, e.clientY);
});
playerHeroFrame.addEventListener('mouseleave', () => hideOppHover());
const tavernMasterFrame = document.getElementById('tavernMasterFrame');
tavernMasterFrame.addEventListener('mouseenter', (e) => showBobHover(e.clientX, e.clientY));
tavernMasterFrame.addEventListener('mousemove', (e) => {
  if (document.getElementById('oppHover').classList.contains('show')) positionOppHover(e.clientX, e.clientY);
});
tavernMasterFrame.addEventListener('mouseleave', () => hideOppHover());
const combatEnemyFrame = document.getElementById('combatEnemyFrame');
combatEnemyFrame.addEventListener('mouseenter', (e) => showCombatEnemyHover(e.clientX, e.clientY));
combatEnemyFrame.addEventListener('mousemove', (e) => {
  if (document.getElementById('oppHover').classList.contains('show')) positionOppHover(e.clientX, e.clientY);
});
combatEnemyFrame.addEventListener('mouseleave', () => hideOppHover());
const endTurnBtn = document.getElementById('btnEnd');
endTurnBtn.addEventListener('mouseenter', (e) => showEndTurnHover(e.clientX, e.clientY));
endTurnBtn.addEventListener('mousemove', (e) => {
  if (document.getElementById('oppHover').classList.contains('show')) positionOppHover(e.clientX, e.clientY);
});
endTurnBtn.addEventListener('mouseleave', () => hideOppHover());
document.getElementById('btnCodex').onclick = () => {
  if (document.getElementById('codexOverlay').classList.contains('open')) closeCodex();
  else openCodex(codexTab);
};
document.getElementById('btnCloseCodex').onclick = () => closeCodex();
document.getElementById('codexTabUnits').onclick = () => {
  codexTab = 'units';
  renderCodexBody();
};
document.getElementById('codexTabSpells').onclick = () => {
  codexTab = 'spells';
  renderCodexBody();
};
document.getElementById('codexTabHeroes').onclick = () => {
  codexTab = 'heroes';
  renderCodexBody();
};
document.getElementById('codexOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'codexOverlay') closeCodex();
});
document.getElementById('btnClosePeek').onclick = () => closePeek();
document.getElementById('btnEnd').onclick = async () => {
  if (phase !== 'recruit' || pendingDiscover) return;
  const you = human();
  if (!you || !you.alive) return;
  const unplayed = you.hand.filter(c => !isSpell(c)).length;
  if (unplayed > 0) {
    log(`${unplayed} minion(s) left in Hand — only Board minions fight.`);
  }
  phase = 'ending';
  setControlsEnabled(false);
  closePeek();
  document.getElementById('phaseRow').classList.remove('show');
  document.getElementById('phaseBanner').textContent = '';
  document.querySelectorAll('.tavernSide').forEach(el => el.classList.remove('show'));
  document.getElementById('tavernMasterFrame').classList.remove('show');
  document.getElementById('combatEnemyFrame').classList.remove('show');
  log('AI opponents taking their turns...');
  await sleep(350);
  for (const p of state.players) {
    if (!p.alive || p.isHuman) continue;
    aiRecruit(p);
  }
  log('Opponents finished recruiting.');
  await runCombatPhase();
};

window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('resize', () => {
  fitCameraToViewport();
  updateHandHoverAnimation();
  if (phase === 'combat') syncEnemyHandOverlay(getCombatEnemy()?.hand || []);
});

function animate() {
  requestAnimationFrame(animate);
  updateHandHoverAnimation();
  if (combatAnim) {
    combatAnim.t = (combatAnim.t || 0) + 0.08;
    cardGroup.children.forEach((c) => {
      if (c === hoveredCard || c.userData.zone === 'hand') return;
      const baseY = c.userData.baseY ?? c.position.y;
      const baseZ = c.userData.baseZ ?? c.position.z;
      if (combatAnim.attackerId && c.userData.minion?.instanceId === combatAnim.attackerId) {
        c.position.y = baseY + Math.sin(combatAnim.t * 10) * 0.12;
        c.position.z = baseZ + Math.sin(combatAnim.t * 10) * 0.35;
      } else {
        c.position.y = baseY;
        c.position.z = baseZ;
      }
    });
  }
  renderer.render(scene, camera);
}

animate();
showTitleScreen();
</script>
