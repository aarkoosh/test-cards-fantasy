function syncOpponents(combatA, combatB) {
  const el = document.getElementById('opponents');
  if (!state) {
    el.innerHTML = '';
    hideOppHover();
    return;
  }
  const ranked = state.players.slice().sort((a, b) => {
    const aAlive = a.alive ? 1 : 0;
    const bAlive = b.alive ? 1 : 0;
    if (bAlive !== aAlive) return bAlive - aAlive;
    const aTotal = (a.hp || 0) + (a.armor || 0);
    const bTotal = (b.hp || 0) + (b.armor || 0);
    if (bTotal !== aTotal) return bTotal - aTotal;
    return a.id - b.id;
  });
  el.innerHTML = ranked.map((p, i) => {
    const rank = i + 1;
    const cls = ['opp'];
    if (!p.alive) cls.push('dead');
    if (p.isHuman) cls.push('self');
    if (p.id === combatA || p.id === combatB) cls.push('combat');
    else if (phase === 'recruit' && state.nextOpponentId != null && p.id === state.nextOpponentId) cls.push('combat');
    if (p.id === peekPlayerId) cls.push('peeking');
    const art = heroPortraitArt(p.hero);
    const name = p.hero.name;
    const maxHp = Math.max(1, p.maxHp || START_HP);
    const maxArmor = 30;
    const hpPct = p.alive ? clamp(((p.hp || 0) / maxHp) * 100, 0, 100) : 0;
    const armorPct = p.alive ? clamp(((p.armor || 0) / maxArmor) * 100, 0, 100) : 0;
    const rankHtml = rank <= 3 ? `<div class="rank">${rank}</div>` : '';
    if (!p.flagColors) p.flagColors = nationFlagColors(p.hero?.nation);
    const flagSrc = buildPlayerFlagSrc(p.flagColors.dark, p.flagColors.light);
    return `<div class="${cls.join(' ')}" data-pid="${p.id}" data-rank="${rank}" title="">
      <div class="oppBody">
        <img class="portrait" src="${art}" alt="${name}">
        ${rankHtml}
        <div class="lifeBars">
          <div class="hpBar"><div class="hpBarFill" style="width:${hpPct.toFixed(1)}%"></div></div>
          <div class="armorBar"><div class="armorBarFill" style="width:${armorPct.toFixed(1)}%"></div></div>
        </div>
      </div>
      <img class="oppFlag" src="${flagSrc}" alt="">
    </div>`;
  }).join('');
  el.querySelectorAll('.opp').forEach(node => {
    const pid = Number(node.getAttribute('data-pid'));
    const rank = Number(node.getAttribute('data-rank'));
    const player = state.players.find(x => x.id === pid);
    if (!player) return;
    node.onmouseenter = (e) => showOppHover(player, rank, e.clientX, e.clientY, node);
    node.onmousemove = (e) => {
      if (document.getElementById('oppHover').classList.contains('show')) {
        positionOppHover(e.clientX, e.clientY, node);
      }
    };
    node.onmouseleave = () => hideOppHover();
    node.onclick = () => {
      if (phase !== 'recruit' && phase !== 'combat') return;
      if (peekPlayerId === pid) closePeek();
      else openPeek(player);
    };
  });
}

  renderer.setSize(w, h);
  if (scene.fog) {

  ctx.imageSmoothingEnabled = true;

  const frozenShop = !!opts.frozenShop;
  const spell = isSpell(card);
  const frameHex = frameColors(card, opts);
  ctx.fillStyle = frameHex;
  ctx.fillRect(0, 0, HALF_TEX, HALF_TEX);
  ctx.fillStyle = spell ? '#101828' : '#120e18';
  roundRect(ctx, 16, 16, 480, 480, 12);
  ctx.fill();
  if (spell) {
    const spellBg = ctx.createRadialGradient(256, 220, 40, 256, 240, 280);
    spellBg.addColorStop(0, '#2a3f66');
    spellBg.addColorStop(0.55, '#172438');
    spellBg.addColorStop(1, '#101828');
    ctx.fillStyle = spellBg;
    roundRect(ctx, 28, 28, 456, 456, 10);
    ctx.fill();
    ctx.strokeStyle = frozenShop ? '#6ec6ff' : '#8eb7ff';
    ctx.lineWidth = 4;
    roundRect(ctx, 28, 28, 456, 456, 10);
    ctx.stroke();
    ctx.fillStyle = 'rgba(159,216,255,0.16)';
    ctx.beginPath();
    ctx.moveTo(256, 120);
    ctx.lineTo(320, 220);
    ctx.lineTo(256, 320);
    ctx.lineTo(192, 220);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(159,216,255,0.45)';
    ctx.lineWidth = 3;
    ctx.stroke();
  } else {
    const artImg = textures[card.art]?.image || textures[ART_A]?.image;
    ctx.save();
    roundRect(ctx, 28, 28, 456, 456, 10);
    ctx.clip();
    if (artImg && artImg.width) {
      const scale = Math.max(456 / artImg.width, 456 / artImg.height);
      const w = artImg.width * scale;
      const h = artImg.height * scale;
      ctx.drawImage(artImg, 28 + (456 - w) / 2, 28 + (456 - h) / 2, w, h);
      if (frozenShop) {
        ctx.fillStyle = 'rgba(110,198,255,0.22)';
        ctx.fillRect(28, 28, 456, 456);
      }
    } else {
      ctx.fillStyle = '#2a3344';
      ctx.fillRect(28, 28, 456, 456);
    }
    ctx.restore();
    ctx.strokeStyle = card.golden ? '#ffd978' : 'rgba(212,175,90,0.55)';
    ctx.lineWidth = 4;
    roundRect(ctx, 28, 28, 456, 456, 10);
    ctx.stroke();
    if (card.divineShield || hasKeyword(card, 'DivineShield')) {
      ctx.beginPath();
      ctx.strokeStyle = '#ffe08a';
      ctx.lineWidth = 8;
      roundRect(ctx, 10, 10, 492, 492, 14);
      ctx.stroke();
    }
  }
  drawTierBadge(ctx, card.tier, 56, 56, 34);
  if (spell) {
    const grad = ctx.createLinearGradient(0, 360, 0, 500);
    grad.addColorStop(0, 'rgba(10,12,18,0)');
    grad.addColorStop(0.55, 'rgba(10,12,18,0.45)');
    grad.addColorStop(1, 'rgba(10,12,18,0.88)');
    ctx.fillStyle = grad;
    ctx.fillRect(28, 360, 456, 140);
    drawGoldCostBadge(ctx, 256, 430, card.cost, 30);
  } else {
    const atk = Number.isFinite(card.attack) ? card.attack : 0;
    const hp = Number.isFinite(card.health) ? card.health : 0;
    const grad = ctx.createLinearGradient(0, 360, 0, 500);
    grad.addColorStop(0, 'rgba(10,12,18,0)');
    grad.addColorStop(0.55, 'rgba(10,12,18,0.45)');
    grad.addColorStop(1, 'rgba(10,12,18,0.88)');
    ctx.fillStyle = grad;
    ctx.fillRect(28, 360, 456, 140);
    ctx.beginPath();
    ctx.arc(78, 430, 44, 0, Math.PI * 2);
    ctx.fillStyle = '#5a2a1a';
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#e0b85a';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(434, 430, 44, 0, Math.PI * 2);
    ctx.fillStyle = '#1a3a2a';
    ctx.fill();
    ctx.strokeStyle = '#7dcea0';
    ctx.stroke();
    ctx.fillStyle = '#fff4d8';
    ctx.font = 'bold 40px Source Sans 3, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(atk), 78, 432);
    ctx.fillStyle = '#e8fff2';
    ctx.fillText(String(hp), 434, 432);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
  return configureCardTexture(new THREE.CanvasTexture(canvas2d));
}

const cardTextureCache = new Map();
const pendingTextureDispose = [];
const CARD_TEXTURE_CACHE_MAX = 120;

function cardTextureKey(card, opts = {}) {
  const artImg = textures[card.art]?.image;
  return [
    card.name,
    String(card.tier),
    String(card.attack),
    String(card.health),
    String(isSpell(card) ? card.cost : ''),
    isSpell(card) ? `goldbadge|${card.category || ''}|${card.text || ''}` : '',
    card.golden ? 1 : 0,
    card.divineShield ? 1 : 0,
    (card.keywords || []).join(','),
    card.art,
    artImg && artImg.width ? 1 : 0,
    opts.half ? 'half' : 'full',
    opts.frozenShop ? 1 : 0,
    opts.isSelected ? 1 : 0,
    opts.isDying ? 1 : 0
  ].join('|');
}

function queueTextureDispose(tex) {
  if (tex) pendingTextureDispose.push(tex);
}

function flushPendingTextureDispose() {
  for (let i = 0; i < pendingTextureDispose.length; i++) {
    pendingTextureDispose[i].dispose();
  }
  pendingTextureDispose.length = 0;
}

function rememberCardTexture(key, tex) {
  if (cardTextureCache.has(key)) cardTextureCache.delete(key);
  cardTextureCache.set(key, tex);
  while (cardTextureCache.size > CARD_TEXTURE_CACHE_MAX) {
    const oldest = cardTextureCache.keys().next().value;
    const oldTex = cardTextureCache.get(oldest);
    cardTextureCache.delete(oldest);
    queueTextureDispose(oldTex);
  }
  return tex;
}

function buildCardFrontTexture(card, opts = {}) {
  const key = cardTextureKey(card, opts);
  let tex = cardTextureCache.get(key);
  if (tex) {
    cardTextureCache.delete(key);
    cardTextureCache.set(key, tex);
    return tex;
  }
  tex = buildCardFrontTextureRaw(card, opts);
  return rememberCardTexture(key, tex);
}

function clearCardTextureCache() {
  for (const tex of cardTextureCache.values()) queueTextureDispose(tex);
  cardTextureCache.clear();
}

function drawArtCover(ctx, artUrl, x, y, w, h) {
  const artImg = textures[artUrl]?.image || textures[ART_A]?.image;
  ctx.save();
  roundRect(ctx, x, y, w, h, 10);
  ctx.clip();
  if (artImg && artImg.width) {
    const scale = Math.max(w / artImg.width, h / artImg.height);
    const dw = artImg.width * scale;
    const dh = artImg.height * scale;
    ctx.drawImage(artImg, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  } else {

    ctx.fillRect(x, y, w, h);

function drawSquareStatBadges(ctx, leftVal, rightVal, leftStyle, rightStyle, opts = {}) {
  const radius = opts.radius ?? 44;
  const fontSize = opts.fontSize ?? 40;
  const cy = opts.cy ?? 430;
  const leftX = opts.leftX ?? 78;
  const rightX = opts.rightX ?? 434;
  const gradTop = opts.gradTop ?? 360;
  const grad = ctx.createLinearGradient(0, gradTop, 0, 500);
  grad.addColorStop(0, 'rgba(10,12,18,0)');
  grad.addColorStop(0.55, 'rgba(10,12,18,0.45)');
  grad.addColorStop(1, 'rgba(10,12,18,0.88)');
  ctx.fillStyle = grad;
  ctx.fillRect(28, gradTop, 456, 512 - gradTop - 12);
  ctx.beginPath();
  ctx.arc(leftX, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = leftStyle.fill;
  ctx.fill();
  ctx.lineWidth = Math.max(5, Math.round(radius * 0.12));
  ctx.strokeStyle = leftStyle.stroke;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(rightX, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = rightStyle.fill;
  ctx.fill();
  ctx.strokeStyle = rightStyle.stroke;
  ctx.stroke();
  ctx.font = `bold ${fontSize}px "Source Sans 3", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = leftStyle.text;
  ctx.fillText(String(leftVal), leftX, cy + 2);
  ctx.fillStyle = rightStyle.text;
  ctx.fillText(String(rightVal), rightX, cy + 2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function paintCanvasFromBuilder(canvas, builder) {
  if (!canvas) return;
  const src = builder();
  const cssSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--stageCard')) || 160;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.max(src.width, Math.ceil(cssSize * dpr * 1.24));
  const ctx = canvas.getContext('2d');
  if (canvas.width !== px || canvas.height !== px) {
    canvas.width = px;
    canvas.height = px;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.clearRect(0, 0, px, px);
  ctx.drawImage(src, 0, 0, px, px);
}

function withStageFaceContext(drawFn) {
  const canvas2d = document.createElement('canvas');
  canvas2d.width = HALF_TEX;
  canvas2d.height = HALF_TEX;
  const ctx = canvas2d.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  drawFn(ctx);
  return canvas2d;
}

  canvas2d.height = FULL_TEX_H;
  const ctx = canvas2d.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const frameHex = frameColors(card, opts);
  ctx.fillStyle = frameHex;
  ctx.fillRect(0, 0, 512, 716);
  ctx.fillStyle = spell ? '#101828' : '#120e18';
  roundRect(ctx, 18, 18, 476, 680, 12);
  ctx.fill();
  if (spell) {
    ctx.fillStyle = '#1b2b4a';
    roundRect(ctx, 36, 36, 440, 280, 8);
    ctx.fill();
    ctx.strokeStyle = '#8eb7ff';
    ctx.lineWidth = 4;
    roundRect(ctx, 36, 36, 440, 280, 8);
    ctx.stroke();
    ctx.fillStyle = '#9fd8ff';
    ctx.font = 'bold 42px Metamorphous, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SUPPORT', 256, 176);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(10,12,18,0.92)';
    roundRect(ctx, 36, 340, 440, 340, 8);
    ctx.fill();
    ctx.fillStyle = '#9fd8ff';
    ctx.font = 'bold 36px Metamorphous, serif';
    const spellName = card.name.length > 20 ? card.name.slice(0, 19) + '…' : card.name;
    ctx.fillText(spellName, 56, 400);
    ctx.fillStyle = '#b9a888';
    ctx.font = 'bold 24px Source Sans 3, sans-serif';
    ctx.fillText(card.category || card.tribe || 'Support', 56, 440);
    ctx.fillStyle = '#eee2cb';
    ctx.font = '26px Source Sans 3, sans-serif';
    const lines = wrapText(ctx, card.text || '', 400);
    lines.slice(0, 3).forEach((line, i) => ctx.fillText(line, 56, 500 + i * 34));
    drawGoldCostBadge(ctx, 256, 640, card.cost, 36);
  } else {
    const artImg = textures[card.art]?.image || textures[ART_A]?.image;
    ctx.save();
    roundRect(ctx, 36, 36, 440, 360, 8);
    ctx.clip();
    if (artImg && artImg.width) {
      const scale = Math.max(440 / artImg.width, 360 / artImg.height);
      const w = artImg.width * scale;
      const h = artImg.height * scale;
      ctx.drawImage(artImg, 36 + (440 - w) / 2, 36 + (360 - h) / 2, w, h);
      if (frozenShop) {
        ctx.fillStyle = 'rgba(110,198,255,0.22)';
        ctx.fillRect(36, 36, 440, 360);
      }
    } else {
      ctx.fillStyle = '#2a3344';
      ctx.fillRect(36, 36, 440, 360);
    }
    ctx.restore();
    ctx.strokeStyle = card.golden ? '#ffd978' : 'rgba(212,175,90,0.55)';
    ctx.lineWidth = 4;
    roundRect(ctx, 36, 36, 440, 360, 8);
    ctx.stroke();
    ctx.fillStyle = 'rgba(10,12,18,0.92)';
    roundRect(ctx, 36, 410, 440, 270, 8);
    ctx.fill();
    ctx.fillStyle = card.golden ? '#ffd978' : '#e0b85a';
    ctx.font = 'bold 36px Metamorphous, serif';
    const name = card.name.length > 20 ? card.name.slice(0, 19) + '…' : card.name;
    ctx.fillText(name, 56, 460);
    ctx.fillStyle = '#b9a888';
    ctx.font = 'bold 24px Source Sans 3, sans-serif';
    ctx.fillText(card.tribe, 56, 500);
    const kws = (card.keywords || []).map(keywordLabel);
    if (kws.length) {
      ctx.fillStyle = '#9fd8ff';
      ctx.font = 'bold 22px Source Sans 3, sans-serif';
      ctx.fillText(kws.join(' · '), 56, 536);
    }
    ctx.beginPath();
    ctx.arc(90, 620, 48, 0, Math.PI * 2);
    ctx.fillStyle = '#5a2a1a';
    ctx.fill();
    ctx.strokeStyle = '#e0b85a';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = '#fff4d8';
    ctx.font = 'bold 44px Source Sans 3, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(card.attack), 90, 622);
    ctx.beginPath();
    ctx.arc(422, 620, 48, 0, Math.PI * 2);
    ctx.fillStyle = '#1a3a2a';
    ctx.fill();
    ctx.strokeStyle = '#7dcea0';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = '#e8fff2';
    ctx.fillText(String(card.health), 422, 622);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    if (card.divineShield || hasKeyword(card, 'DivineShield')) {
      ctx.strokeStyle = '#ffe08a';
      ctx.lineWidth = 8;
      roundRect(ctx, 12, 12, 488, 692, 14);
      ctx.stroke();
    }
    if (card.golden) {
      ctx.fillStyle = '#ffd978';
      ctx.font = 'bold 20px Metamorphous, serif';
      ctx.fillText('ELITE', 56, 660);
    }
  }
  drawTierBadge(ctx, card.tier, 62, 62, 38);
  return configureCardTexture(new THREE.CanvasTexture(canvas2d));
}

function wrapText(ctx, text, maxWidth) {
  const words = String(text).split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? `${line} ${word}` : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

let cardBackTexture = null;
function getCardBackTexture() {
  if (cardBackTexture) return cardBackTexture;
  const canvas2d = document.createElement('canvas');
  canvas2d.width = 512;
  canvas2d.height = 716;
  const ctx = canvas2d.getContext('2d');
  const bg = ctx.createLinearGradient(0, 0, 512, 716);
  bg.addColorStop(0, '#1a2438');
  bg.addColorStop(0.5, '#121826');
  bg.addColorStop(1, '#0c1018');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 512, 716);
  ctx.strokeStyle = 'rgba(212,175,90,0.7)';
  ctx.lineWidth = 10;
  roundRect(ctx, 22, 22, 468, 672, 14);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(212,175,90,0.35)';
  ctx.lineWidth = 4;
  roundRect(ctx, 48, 48, 416, 620, 10);
  ctx.stroke();
  for (let i = 0; i < 7; i++) {
    ctx.strokeStyle = `rgba(212,175,90,${0.08 + (i % 2) * 0.06})`;
    ctx.lineWidth = 2;
    roundRect(ctx, 70 + i * 8, 70 + i * 10, 372 - i * 16, 576 - i * 20, 8);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(224,184,90,0.16)';
  ctx.beginPath();
  ctx.moveTo(256, 160);
  ctx.lineTo(330, 260);
  ctx.lineTo(256, 360);
  ctx.lineTo(182, 260);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(224,184,90,0.55)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#e0b85a';
  ctx.font = 'bold 54px Metamorphous, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('FB', 256, 260);
  ctx.fillStyle = '#b9a888';
  ctx.font = 'bold 22px Metamorphous, serif';
  ctx.fillText('FLAG', 256, 520);
  ctx.fillText('BEARER', 256, 552);
  cardBackTexture = configureCardTexture(new THREE.CanvasTexture(canvas2d));
  return cardBackTexture;
}

function createCardMeshGroup(w, h, frontTex, opts = {}) {
  const group = new THREE.Group();
  const faceDown = !!opts.faceDown;
  const edgeColor = opts.edgeColor ?? 0x3a2f1c;
  const edgeMat = new THREE.MeshBasicMaterial({ color: edgeColor });
  const frontMat = new THREE.MeshBasicMaterial({ map: frontTex });
  const backMat = new THREE.MeshBasicMaterial({
    map: faceDown ? null : getCardBackTexture(),
    color: faceDown ? 0x1a1424 : 0xffffff
  });
  const body = new THREE.Mesh(
    getCardGeometry(w, h),
    [edgeMat, edgeMat, edgeMat, edgeMat, frontMat, backMat]
  );
  group.add(body);
  if (opts.glowColor != null) {
    const glow = new THREE.Mesh(
      getGlowGeometry(w, h),
      new THREE.MeshBasicMaterial({
        color: opts.glowColor,
        transparent: true,
        opacity: 0.22,
        depthWrite: false
      })
    );
    glow.position.z = -0.01;
    group.add(glow);
  }
  group.userData = {
    cardW: w,
    cardH: h,
    faceDown,
    ...(opts.userData || {})
  };
  return group;
}

function makeCardMesh(card, zone, index, opts = {}) {
  const faceDown = !!opts.faceDown;
  const isSelected = !faceDown && selected && selected.minion && selected.minion.instanceId === card.instanceId;
  const isDying = !faceDown && Array.isArray(opts.dyingIds) && opts.dyingIds.includes(card.instanceId);
  const frozenShop = !!opts.frozenShop;
  const half = isHalfCardZone(zone);
  const { w, h } = cardSizeForZone(zone);
  let edgeColor = isSpell(card) ? 0x2a3a5c : 0x3a2f1c;
  if (card.golden) edgeColor = 0xd4af37;
  if (frozenShop) edgeColor = 0x6ec6ff;
  if (isSelected) edgeColor = 0x7ad0ff;
  if (isDying) edgeColor = 0xff6b5a;
  if (faceDown) edgeColor = 0x2a3348;
  const frontTex = faceDown ? getCardBackTexture() : buildCardFrontTexture(card, { frozenShop, isSelected, isDying, half });
  let glowColor = null;
  if (isSelected) glowColor = 0x4aa8ff;
  if (isDying) glowColor = 0xff4020;
  return createCardMeshGroup(w, h, frontTex, {
    faceDown,
    edgeColor,
    glowColor,
    userData: { minion: card, zone, index }
  });
}

function disposeStageMesh(group) {
  if (!group) return;
  group.traverse(obj => {
    if (!obj.isMesh) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const mat of mats) {
      if (!mat) continue;
      if (mat.map && mat.map !== cardBackTexture) mat.map.dispose();
      mat.dispose();
    }
  });
}

function clearStageMeshes() {
  while (stageCardGroup.children.length) {
    const child = stageCardGroup.children[0];
    stageCardGroup.remove(child);
    disposeStageMesh(child);
  }
  stageMeshes.length = 0;
}

function makeStageCardMesh(imageCanvas, userData = {}) {
  const { w, h } = cardSizeForZone('stage');
  const frontTex = configureCardTexture(new THREE.CanvasTexture(imageCanvas));
  return createCardMeshGroup(w, h, frontTex, {
    edgeColor: 0x3a2f1c,
    userData: {
      zone: 'stage',
      minion: null,
      ...userData
    }
  });
}

function placeMeshAtDomElement(mesh, el) {
  if (!mesh || !el) return;
  const r = el.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  const cx = r.left + r.width * 0.5;
  const cy = r.top + r.height * 0.5;
  pointer.x = (cx / window.innerWidth) * 2 - 1;
  pointer.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  stagePlacePlane.constant = -BOARD_ROW_Y;
  if (!raycaster.ray.intersectPlane(stagePlacePlane, stagePlaceHit)) return;
  mesh.position.set(stagePlaceHit.x, BOARD_ROW_Y, stagePlaceHit.z);
  mesh.rotation.set(BOARD_ROW_ROTX, 0, 0);
  mesh.userData.baseX = stagePlaceHit.x;
  mesh.userData.baseY = BOARD_ROW_Y;
  mesh.userData.baseZ = stagePlaceHit.z;
  mesh.userData.baseRotX = BOARD_ROW_ROTX;
  mesh.userData.baseRotY = 0;
  if (hoveredCard !== mesh) mesh.scale.set(1, 1, 1);
}

function isDomStageVisible(el) {
  if (!el) return false;
  if (el.id === 'tavernMasterFrame' || el.id === 'combatEnemyFrame' || el.id === 'combatEnemyPower') {
    if (!el.classList.contains('show')) return false;
  }
  const style = getComputedStyle(el);
  if (style.display === 'none' || style.visibility === 'hidden') return false;
  const r = el.getBoundingClientRect();
  return r.width > 1 && r.height > 1;
}

function setStageMeshOpacity(mesh, opacity) {
  if (!mesh) return;
  mesh.traverse(obj => {
    if (!obj.isMesh) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const mat of mats) {
      if (!mat) continue;
      mat.transparent = opacity < 1;
      mat.opacity = opacity;
    }
  });
}

function addStageMeshFor(el, imageCanvas, userData) {
  if (!isDomStageVisible(el) || !imageCanvas) return;
  const mesh = makeStageCardMesh(imageCanvas, { ...userData, domEl: el });
  placeMeshAtDomElement(mesh, el);
  if (el.matches && el.matches('button:disabled')) setStageMeshOpacity(mesh, 0.45);
  stageCardGroup.add(mesh);
  stageMeshes.push(mesh);
}

function syncStageMeshes() {
  if (hoveredCard && hoveredCard.userData?.zone === 'stage') {
    resetCardHoverVisual(hoveredCard);
    hoveredCard = null;
  }
  clearStageMeshes();
  const p = human();
  if (!p || document.getElementById('ui')?.classList.contains('hidden')) return;
  const portraitSlot = document.getElementById('playerPortraitSlot');
  const playerFrame = document.getElementById('playerHeroFrame');
  const powerBtn = document.getElementById('btnHeroPower');
  const bobFrame = document.getElementById('tavernMasterFrame');
  const enemyFrame = document.getElementById('combatEnemyFrame');
  const enemyPower = document.getElementById('combatEnemyPower');
  if (portraitSlot && !portraitSlot.classList.contains('hidden')) {
    addStageMeshFor(
      playerFrame,
      buildSquareLordFaceImage(p.hero, { armor: p.armor, hp: p.hp }),
      { stageKind: 'playerLord' }
    );
    addStageMeshFor(
      powerBtn,
      buildSquareAbilityFaceImage(p.hero),
      { stageKind: 'playerPower' }
    );
  }
  if (bobFrame.classList.contains('show')) {
    addStageMeshFor(
      bobFrame,
      buildSquareBobFaceImage(p),
      { stageKind: 'bob' }
    );
  }
  const enemy = getCombatEnemy();
  if (enemyFrame.classList.contains('show') && enemy?.hero) {
    addStageMeshFor(
      enemyFrame,
      buildSquareLordFaceImage(enemy.hero, { armor: enemy.armor, hp: enemy.hp }),
      { stageKind: 'enemyLord' }
    );
    addStageMeshFor(
      enemyPower,
      buildSquareAbilityFaceImage(enemy.hero),
      { stageKind: 'enemyPower' }
    );
  }
}

function syncStageMeshLayout() {
  for (const mesh of stageMeshes) {
    if (hoveredCard === mesh) continue;
    placeMeshAtDomElement(mesh, mesh.userData.domEl);
  }
}

function showStageMeshTooltip(mesh, clientX, clientY) {
  const kind = mesh.userData.stageKind;
  const anchor = mesh.userData.domEl;
  if (kind === 'playerLord') showPlayerHeroFrameHover(clientX, clientY, anchor);
  else if (kind === 'playerPower') showHeroPowerHover(clientX, clientY, anchor);
  else if (kind === 'bob') showBobHover(clientX, clientY, anchor);
  else if (kind === 'enemyLord') showCombatEnemyHover(clientX, clientY, anchor);
  else if (kind === 'enemyPower') showCombatEnemyPowerHover(clientX, clientY, anchor);
}

function layoutRow(items, z, y, spacing, rotX = -Math.PI / 2) {
  const start = -((items.length - 1) * spacing) / 2;
  items.forEach((mesh, i) => {
    const x = start + i * spacing;
    mesh.position.set(x, y, z);
    mesh.rotation.x = rotX;
    mesh.rotation.y = 0;
    mesh.rotation.z = 0;
    mesh.userData.baseX = x;
    mesh.userData.baseY = y;
    mesh.userData.baseZ = z;
    mesh.userData.baseRotX = rotX;
    mesh.userData.baseRotY = 0;
  });
}

function resetCardHoverVisual(card) {
  if (!card || card.userData.zone === 'hand') return;
  card.rotation.x = card.userData.baseRotX ?? card.rotation.x;
  card.rotation.y = card.userData.baseRotY ?? 0;
  card.position.y = card.userData.baseY ?? card.position.y;
  card.position.z = card.userData.baseZ ?? card.position.z;
  card.scale.set(1, 1, 1);
}

function isPointerOverStageCard(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  return !!(el && el.closest && el.closest('.stageCard'));
}

function clearCardHover(opts = {}) {
  resetCardHoverVisual(hoveredCard);
  hoveredCard = null;
  if (!opts.keepTooltip) hideCardTooltip();
}

function applyCardHoverTilt(card, point) {
  if (card.userData.zone === 'hand') return;
  const local = card.worldToLocal(point.clone());
  const halfW = (card.userData.cardW || FULL_CARD_W) * 0.5;
  const halfH = (card.userData.cardH || FULL_CARD_H) * 0.5;
  const tilt = getCardHoverTiltAxes(local.x / halfW, local.y / halfH);
  const boardLike = isHalfCardZone(card.userData.zone);
  card.rotation.x = (card.userData.baseRotX ?? -Math.PI / 2) + tilt.pitch;
  card.rotation.y = tilt.yaw;
  card.position.y = (card.userData.baseY ?? card.position.y) + (boardLike ? CARD_HOVER_TILT.raiseHalf : CARD_HOVER_TILT.raiseFull);
  card.scale.setScalar(boardLike ? CARD_HOVER_TILT.scaleHalf : CARD_HOVER_TILT.scaleFull);
}

const handOverlayCenter = new THREE.Vector3();
const handOverlayEdge = new THREE.Vector3();
const handOverlayProj = new THREE.Vector3();
const handOverlayQuat = new THREE.Quaternion();
const handOverlayParentQuat = new THREE.Quaternion();

function setHandMeshHiddenForOverlay(group, hidden) {
  const body = group?.children?.[0];
  if (!body?.material) return;
  const mats = Array.isArray(body.material) ? body.material : [body.material];
  for (const mat of mats) {
    if (!mat) continue;
    mat.transparent = true;
    mat.opacity = hidden ? 0 : 1;
    mat.depthWrite = !hidden;
  }
  for (let i = 1; i < group.children.length; i++) {
    group.children[i].visible = !hidden;
  }
}

function projectWorldPointToScreen(v) {
  handOverlayProj.copy(v).project(camera);
  return {
    x: (handOverlayProj.x * 0.5 + 0.5) * window.innerWidth,
    y: (-handOverlayProj.y * 0.5 + 0.5) * window.innerHeight
  };
}

function measureHandCardScreenSize(baseX, baseY, baseZ, baseRotX, cardW, cardH, parent) {
  const halfW = cardW * 0.5;
  const halfH = cardH * 0.5;
  handOverlayCenter.set(baseX, baseY, baseZ);
  if (parent) parent.localToWorld(handOverlayCenter);
  handOverlayQuat.setFromEuler(new THREE.Euler(baseRotX, 0, 0, 'XYZ'));
  if (parent) {
    parent.getWorldQuaternion(handOverlayParentQuat);
    handOverlayQuat.premultiply(handOverlayParentQuat);
  }
  const origin = projectWorldPointToScreen(handOverlayCenter);
  handOverlayEdge.set(halfW, 0, 0).applyQuaternion(handOverlayQuat).add(handOverlayCenter);
  const right = projectWorldPointToScreen(handOverlayEdge);
  handOverlayEdge.set(0, halfH, 0).applyQuaternion(handOverlayQuat).add(handOverlayCenter);
  const top = projectWorldPointToScreen(handOverlayEdge);
  const screenW = Math.max(36, Math.hypot(right.x - origin.x, right.y - origin.y) * 2);
  const screenH = Math.max(50, Math.hypot(top.x - origin.x, top.y - origin.y) * 2);
  return {
    cx: origin.x,
    cy: origin.y,
    left: origin.x - screenW * 0.5,
    right: origin.x + screenW * 0.5,
    top: origin.y - screenH * 0.5,
    bottom: origin.y + screenH * 0.5,
    width: screenW,
    height: screenH
  };
}

function getHandCardBaseScreenRect(mesh) {
  return measureHandCardScreenSize(
    mesh.userData.baseX ?? mesh.position.x,
    mesh.userData.baseY ?? HAND_ROW_Y,
    mesh.userData.baseZ ?? HAND_ROW_Z,
    mesh.userData.baseRotX ?? HAND_ROW_ROTX,
    mesh.userData.cardW || FULL_CARD_W,
    mesh.userData.cardH || FULL_CARD_H,
    mesh.parent
  );
}

function getHandScreenCardSize() {
  const height = Math.min(230, Math.max(130, window.innerHeight * 0.26));
  const width = height * (FULL_CARD_W / FULL_CARD_H);
  return { width, height };
}

function getHalfCardScreenSize() {
  const rect = measureHandCardScreenSize(
    0,
    BOARD_ROW_Y,
    BOARD_ROW_Z,
    BOARD_ROW_ROTX,
    HALF_CARD,
    HALF_CARD,
    null
  );
  const size = Math.round(Math.max(rect.width, rect.height));
  return Math.max(120, Math.min(220, size));
}

function syncStageCardSize() {
  if (typeof HALF_CARD !== 'number') return;
  const size = getHalfCardScreenSize();
  document.documentElement.style.setProperty('--stageCard', `${size}px`);
  syncStageMeshLayout();
}

function getPlayerHandCardScreenSize() {
  return getHandScreenCardSize();
}

function handHoverEase(hoverT) {
  const t = hoverT ?? 0;
  return t * t * (3 - 2 * t);
}

function findHandCardAtPointer(clientX, clientY) {
  if (clientY > window.innerHeight) return null;
  let best = null;
  let bestDx = Infinity;
  for (const mesh of cardMeshes) {
    if (mesh.userData.zone !== 'hand') continue;
    const cx = mesh.userData.screenCx;
    const restCy = mesh.userData.screenRestCy;
    const baseW = mesh.userData.screenW;
    const baseH = mesh.userData.screenH;
    if (cx == null || restCy == null || !baseW || !baseH) continue;
    const ease = handHoverEase(mesh.userData.hoverT);
    const scale = 1 + ease * HAND_SCREEN_HOVER_SCALE;
    const cy = restCy - ease * baseH * HAND_SCREEN_HOVER_LIFT;
    const halfW = baseW * scale * 0.42;
    const halfH = baseH * scale * 0.5;
    const top = cy - halfH;
    const bottom = Math.min(window.innerHeight, cy + halfH);
    if (clientY < top || clientY > bottom) continue;
    const dx = Math.abs(clientX - cx);
    if (dx < bestDx) {
      bestDx = dx;
      best = { mesh, halfW };
    }
  }
  if (!best || bestDx > best.halfW) return null;
  return best.mesh;
}

function handCardArtKey(minion, isSelected) {
  return [
    minion.instanceId,
    minion.attack,
    minion.health,
    minion.cost,
    minion.golden ? 1 : 0,
    isSelected ? 1 : 0,
    (minion.keywords || []).join(',')
  ].join('|');
}

function rectsOverlap(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

function syncPortraitHandBlocking() {
  const nodes = [
    document.getElementById('btnHeroPower'),
    document.getElementById('playerHeroFrame')
  ];
  const blocking = !!(dragState?.dragging);
  for (const node of nodes) {
    if (!node) continue;
    node.style.pointerEvents = blocking ? 'none' : 'auto';
  }
}

function hideHandOverlay() {
  const layer = document.getElementById('handOverlay');
  if (layer) {
    layer.classList.remove('show');
    layer.innerHTML = '';
  }
  for (const mesh of cardMeshes) {
    if (mesh.userData.zone === 'hand') setHandMeshHiddenForOverlay(mesh, false);
  }
  syncPortraitHandBlocking();
}

function hideEnemyHandOverlay() {
  const layer = document.getElementById('enemyHandOverlay');
  if (layer) {
    layer.classList.remove('show');
    layer.innerHTML = '';
  }
}

function syncEnemyHandOverlay(cards) {
  const layer = document.getElementById('enemyHandOverlay');
  if (!layer) return;
  const list = cards || [];
  if (phase !== 'combat' || !list.length) {
    hideEnemyHandOverlay();
    return;
  }
  const size = getPlayerHandCardScreenSize();
  const overlap = size.width * (1 - HAND_ROW_SPACING / FULL_CARD_W);
  layer.style.setProperty('--enemy-hand-overlap', `${-overlap}px`);
  layer.style.left = '50%';
  layer.style.top = '0px';
  layer.classList.add('show');
  while (layer.children.length < list.length) {
    const el = document.createElement('div');
    el.className = 'enemyHandOverlayCard';
    el.appendChild(document.createElement('canvas'));
    layer.appendChild(el);
  }
  while (layer.children.length > list.length) {
    layer.removeChild(layer.lastChild);
  }
  const back = getCardBackTexture().image;
  list.forEach((_, i) => {
    const el = layer.children[i];
    const canvas = el.firstChild;
    el.style.width = `${size.width}px`;
    el.style.height = `${size.height}px`;
    if (el.dataset.key !== 'back') {
      el.dataset.key = 'back';
      const ctx = canvas.getContext('2d');
      canvas.width = back.width;
      canvas.height = back.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(back, 0, 0);
    }
  });
}

let handOverlayNeedsSync = true;
let portraitBlockDirty = true;

function syncHandOverlayLayer() {
  const layer = document.getElementById('handOverlay');
  if (!layer) return;
  const uiHidden = document.getElementById('ui')?.classList.contains('hidden');
  const handMeshes = cardMeshes.filter(m => m.userData.zone === 'hand');
  if (uiHidden || !handMeshes.length) {
    hideHandOverlay();
    handOverlayNeedsSync = false;
    return;
  }
  layer.classList.add('show');
  while (layer.children.length < handMeshes.length) {
    const el = document.createElement('div');
    el.className = 'handOverlayCard';
    el.appendChild(document.createElement('canvas'));
    layer.appendChild(el);
  }
  while (layer.children.length > handMeshes.length) {
    layer.removeChild(layer.lastChild);
  }
  const size = getHandScreenCardSize();
  const spacing = size.width * (HAND_ROW_SPACING / FULL_CARD_W);
  const totalW = handMeshes.length > 1 ? (handMeshes.length - 1) * spacing : 0;
  const startX = window.innerWidth * 0.5 - totalW * 0.5;
  const restCy = window.innerHeight;
  let anyRaised = false;
  handMeshes.forEach((mesh, i) => {
    const el = layer.children[i];
    const canvas = el.firstChild;
    const minion = mesh.userData.minion;
    const isSelected = !!(selected && selected.minion && selected.minion.instanceId === minion.instanceId);
    const key = handCardArtKey(minion, isSelected);
    if (el.dataset.key !== key) {
      el.dataset.key = key;
      const tex = buildCardFrontTexture(minion, { isSelected, half: false });
      const src = tex.image;
      const ctx = canvas.getContext('2d');
      canvas.width = src.width;
      canvas.height = src.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(src, 0, 0);
    }
    const hoverT = mesh.userData.hoverT ?? 0;
    const ease = handHoverEase(hoverT);
    const hoverScale = 1 + ease * HAND_SCREEN_HOVER_SCALE;
    const cardW = size.width * hoverScale;
    const cardH = size.height * hoverScale;
    const isDraggingThis = !!(dragState?.dragging && dragState.instanceId === minion.instanceId);
    if (hoverT > 0.05 || isDraggingThis) anyRaised = true;
    let cx = startX + i * spacing;
    let cy = restCy - ease * size.height * HAND_SCREEN_HOVER_LIFT;
    if (isDraggingThis) {
      mesh.getWorldPosition(handOverlayCenter);
      const center = projectWorldPointToScreen(handOverlayCenter);
      cx = center.x;
      cy = center.y;
    }
    mesh.userData.screenCx = startX + i * spacing;
    mesh.userData.screenRestCy = restCy;
    mesh.userData.screenW = size.width;
    mesh.userData.screenH = size.height;
    el.style.left = `${cx}px`;
    el.style.top = `${cy}px`;
    el.style.width = `${cardW}px`;
    el.style.height = `${cardH}px`;
    el.classList.toggle('raised', hoverT > 0.2 || isDraggingThis);
    el.style.zIndex = String(1 + Math.round(hoverT * 12) + (isDraggingThis ? 20 : 0));
    setHandMeshHiddenForOverlay(mesh, true);
  });
  if (anyRaised || portraitBlockDirty) {
    syncPortraitHandBlocking();
    portraitBlockDirty = anyRaised;
  }
  handOverlayNeedsSync = false;
}

function updateHandHoverAnimation() {
  const draggingId = dragState?.dragging ? dragState.instanceId : null;
  let animating = !!draggingId;
  for (const mesh of cardMeshes) {
    if (mesh.userData.zone !== 'hand') continue;
    if (draggingId && mesh.userData.minion?.instanceId === draggingId) {
      mesh.userData.hoverT = 0;
      animating = true;
      continue;
    }
    const raised = hoveredCard === mesh;
    const target = raised ? 1 : 0;
    const prev = mesh.userData.hoverT ?? 0;
    const next = prev + (target - prev) * 0.2;
    const settled = Math.abs(next - target) < 0.002;
    mesh.userData.hoverT = settled ? target : next;
    if (!settled || prev !== mesh.userData.hoverT) animating = true;
    if (!dragState?.dragging || mesh.userData.minion?.instanceId !== dragState.instanceId) {
      mesh.position.x = mesh.userData.baseX ?? mesh.position.x;
      mesh.position.y = mesh.userData.baseY ?? HAND_ROW_Y;
      mesh.position.z = mesh.userData.baseZ ?? HAND_ROW_Z;
      mesh.rotation.x = mesh.userData.baseRotX ?? HAND_ROW_ROTX;
      mesh.rotation.y = 0;
      mesh.scale.set(1, 1, 1);
    }
  }
  if (animating || handOverlayNeedsSync) syncHandOverlayLayer();
}

function renderHandRow(player, z = HAND_ROW_Z, y = HAND_ROW_Y) {
  const handMeshes = [];
  player.hand.forEach((m, i) => {
    const mesh = makeCardMesh(m, 'hand', i);
    handMeshes.push(mesh);
    cardMeshes.push(mesh);
    cardGroup.add(mesh);
  });
  layoutRow(handMeshes, z, y, HAND_ROW_SPACING, HAND_ROW_ROTX);
}

function renderEnemyHandRow(cards) {
  syncEnemyHandOverlay(cards);
}

function renderBoardRow(cards, zone, z, y, opts = {}) {
  const meshes = [];
  cards.forEach((m, i) => {
    const mesh = makeCardMesh(m, zone, i, opts);
    meshes.push(mesh);
    cardMeshes.push(mesh);
    cardGroup.add(mesh);
  });
  layoutRow(meshes, z, y, opts.spacing ?? BOARD_ROW_SPACING, opts.rotX ?? BOARD_ROW_ROTX);
}

function renderCards() {
  if (dragState?.dragging) return;
  clearCardHover();
  clearCardGroup();
  handOverlayNeedsSync = true;
  portraitBlockDirty = true;
  if (!state) return;
  const p = human();
  if (!p) return;
  if (phase === 'combat' && combatAnim) {
    const boardA = combatAnim.boardA || [];
    const boardB = combatAnim.boardB || [];
    const supportA = combatAnim.supportA || [];
    const supportB = combatAnim.supportB || [];
    const aIsYou = !!(combatAnim.a && (combatAnim.a.isHuman || combatAnim.a.id === p.id));
    const bIsYou = !!(combatAnim.b && (combatAnim.b.isHuman || combatAnim.b.id === p.id));
    let mine;
    let theirs;
    let mySupport;
    let theirSupport;
    let foe = null;
    if (aIsYou) {
      mine = boardA;
      theirs = boardB;
      mySupport = supportA;
      theirSupport = supportB;
      foe = combatAnim.b;
    } else if (bIsYou) {
      mine = boardB;
      theirs = boardA;
      mySupport = supportB;
      theirSupport = supportA;
      foe = combatAnim.a;
    } else {
      mine = boardA;
      theirs = boardB;
      mySupport = supportA;
      theirSupport = supportB;
      foe = combatAnim.b;
    }
    renderBoardRow(theirSupport, 'enemySupport', ENEMY_SUPPORT_ROW_Z, TAVERN_ROW_Y, {
      spacing: SUPPORT_ROW_SPACING,
      rotX: SUPPORT_ROW_ROTX
    });
    renderBoardRow(theirs, 'enemy', ENEMY_BOARD_ROW_Z, TAVERN_ROW_Y, {
      attackerId: combatAnim.attackerId,
      dyingIds: combatAnim.dyingIds || [],
      spacing: TAVERN_ROW_SPACING,
      rotX: TAVERN_ROW_ROTX
    });
    renderBoardRow(mine, 'board', BOARD_ROW_Z, BOARD_ROW_Y, {
      attackerId: combatAnim.attackerId,
      dyingIds: combatAnim.dyingIds || []
    });
    renderBoardRow(mySupport, 'support', SUPPORT_ROW_Z, SUPPORT_ROW_Y, {
      spacing: SUPPORT_ROW_SPACING,
      rotX: SUPPORT_ROW_ROTX
    });
    renderHandRow(p);
    renderEnemyHandRow(foe?.hand || []);
    return;
  }
  hideEnemyHandOverlay();
  const shopMeshes = [];
  p.shop.forEach((m, i) => {
    if (!m) return;
    const mesh = makeCardMesh(m, 'shop', i, { frozenShop: p.frozen });
    shopMeshes.push(mesh);
    cardMeshes.push(mesh);
    cardGroup.add(mesh);
  });
  layoutRow(shopMeshes, TAVERN_ROW_Z, p.frozen ? TAVERN_ROW_Y_FROZEN : TAVERN_ROW_Y, TAVERN_ROW_SPACING, TAVERN_ROW_ROTX);
  renderBoardRow(p.board, 'board', BOARD_ROW_Z, BOARD_ROW_Y);
  renderBoardRow(p.support || [], 'support', SUPPORT_ROW_Z, SUPPORT_ROW_Y, {
    spacing: SUPPORT_ROW_SPACING,
    rotX: SUPPORT_ROW_ROTX
  });
  renderHandRow(p);
}

let tooltipCardId = null;

function hideCardTooltip() {
  tooltipCardId = null;
  const tip = document.getElementById('cardTooltip');
  if (tip) tip.classList.remove('show');
}

function positionCardTooltip(clientX, clientY, anchorEl) {
  const tip = document.getElementById('cardTooltip');
  if (!tip || !tip.classList.contains('show')) return;
  const pad = 12;
  const tw = tip.offsetWidth || 210;
  const th = tip.offsetHeight || 294;
  let left;
  let top;
  if (anchorEl) {
    const r = anchorEl.getBoundingClientRect();
    left = r.left - tw - 18;
    if (left < pad) left = r.right + 18;
    if (left + tw > window.innerWidth - pad) left = Math.max(pad, window.innerWidth - tw - pad);
    const preferAbove = r.top + r.height * 0.5 > window.innerHeight * 0.45;
    if (preferAbove) {
      top = r.top - th - 14;
      if (top < pad) top = pad;
      if (top + th > r.top - 8) top = Math.max(pad, r.top - th - 14);
    } else {
      top = r.bottom + 14;
      if (top + th > window.innerHeight - pad) {
        top = r.top + r.height * 0.5 - th * 0.5;
        if (top < pad) top = pad;
        if (top + th > window.innerHeight - pad) top = window.innerHeight - th - pad;
      }
    }
  } else {
    left = clientX - tw - 72;
    top = clientY - th * 0.55;
    if (left < pad) left = pad;
    if (left + tw > window.innerWidth - pad) left = Math.max(pad, window.innerWidth - tw - pad);
    if (top < pad) top = pad;
    if (top + th > window.innerHeight - pad) top = window.innerHeight - th - pad;
  }
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}

function showFullCardTooltip(key, src, clientX, clientY, anchorEl) {
  const tip = document.getElementById('cardTooltip');
  if (!tip || !src) return;
  hideOppHover();
  if (tooltipCardId !== key) {
    tooltipCardId = key;
    const canvas = document.getElementById('cardTooltipCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = src.width;
    canvas.height = src.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(src, 0, 0);
  }
  tip.classList.add('show');
  positionCardTooltip(clientX, clientY, anchorEl);
}

function showTooltipFor(minion, mesh, clientX, clientY) {
  const tip = document.getElementById('cardTooltip');
  if (!tip) return;
  if (!minion || !mesh || !isHalfCardZone(mesh.userData.zone) || mesh.userData.faceDown) {
    hideCardTooltip();
    return;
  }
  const frozenShop = mesh.userData.zone === 'shop' && !!human()?.frozen;
  const isSelected = !!(selected && selected.minion && selected.minion.instanceId === minion.instanceId);
  const tex = buildCardFrontTexture(minion, { frozenShop, isSelected, half: false });
  showFullCardTooltip(`minion|${minion.instanceId}|${isSelected ? 1 : 0}|${frozenShop ? 1 : 0}`, tex.image, clientX, clientY);
}

let dragState = null;
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const dragHit = new THREE.Vector3();

function resolveCardHit(hits) {
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && !(obj.userData && (obj.userData.minion || obj.userData.zone === 'stage'))) obj = obj.parent;
  return obj || null;
}

function clearSellTargetHighlight() {
  const bob = document.getElementById('tavernMasterFrame');
  bob.classList.remove('sellTarget', 'sellHot');
}

function isPointerOverBob(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  return !!(el && el.closest && el.closest('#tavernMasterFrame'));
}

function isPointerOverPlayerPortrait(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  return !!(el && el.closest && el.closest('#playerPortraitSlot'));
}

function isDropInHandBuyZone(mesh, clientX, clientY) {
  if (mesh && mesh.position.z >= (SUPPORT_ROW_Z + HAND_ROW_Z) * 0.5) return true;
  if (isPointerOverPlayerPortrait(clientX, clientY)) return true;
  return false;
}

function isDropInSupportPlayZone(mesh) {
  if (!mesh) return false;
  const z = mesh.position.z;
  return z > (BOARD_ROW_Z + SUPPORT_ROW_Z) * 0.5 && z < (SUPPORT_ROW_Z + HAND_ROW_Z) * 0.5;
}

function isDropInBoardPlayZone(mesh) {
  if (!mesh) return false;
  const z = mesh.position.z;
  return z > (TAVERN_ROW_Z + BOARD_ROW_Z) * 0.5 && z < (BOARD_ROW_Z + SUPPORT_ROW_Z) * 0.5;
}

function findDragMesh() {
  if (!dragState) return null;
  return cardMeshes.find(m => m.userData?.minion?.instanceId === dragState.instanceId) || null;
}

function resolveRowDropIndex(clientX, clientY, draggedInstanceId, mesh, cards, zone) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(cardMeshes, true);
  for (const hit of hits) {
    let obj = hit.object;
    while (obj && !(obj.userData && obj.userData.minion)) obj = obj.parent;
    if (!obj) continue;
    if (obj.userData.minion?.instanceId === draggedInstanceId) continue;
    if (obj.userData.zone === zone) return obj.userData.index;
  }
  if (mesh) {
    const targets = cardMeshes
      .filter(m => m.userData.zone === zone && m.userData.minion?.instanceId !== draggedInstanceId)
      .slice()
      .sort((a, b) => (a.userData.baseX ?? a.position.x) - (b.userData.baseX ?? b.position.x));
    if (!targets.length) return cards.length;
    for (const target of targets) {
      const tx = target.userData.baseX ?? target.position.x;
      if (mesh.position.x < tx) return target.userData.index;
    }
    return targets[targets.length - 1].userData.index + 1;
  }
  return cards.length;
}

function resolveBoardDropIndex(clientX, clientY, draggedInstanceId, mesh, player) {
  return resolveRowDropIndex(clientX, clientY, draggedInstanceId, mesh, player.board, 'board');
}

function resolveSupportDropIndex(clientX, clientY, draggedInstanceId, mesh, player) {
  return resolveRowDropIndex(clientX, clientY, draggedInstanceId, mesh, player.support || [], 'support');
}

function moveRowCard(cards, fromIndex, toIndex) {
  if (!cards || fromIndex < 0 || fromIndex >= cards.length) return false;
  const dest = clamp(toIndex, 0, cards.length);
  if (dest === fromIndex || dest === fromIndex + 1) return false;
  const [card] = cards.splice(fromIndex, 1);
  let insertAt = dest;
  if (insertAt > fromIndex) insertAt--;
  cards.splice(insertAt, 0, card);
  return true;
}

function moveBoardCard(player, fromIndex, toIndex) {
  return moveRowCard(player.board, fromIndex, toIndex);
}

function moveSupportCard(player, fromIndex, toIndex) {
  if (!player.support) player.support = [];
  return moveRowCard(player.support, fromIndex, toIndex);
}

function updateDragCardPosition(clientX, clientY) {
  const mesh = findDragMesh();
  if (!mesh) return;
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  dragPlane.constant = -(mesh.userData.baseY ?? 2);
  if (raycaster.ray.intersectPlane(dragPlane, dragHit)) {
    mesh.position.x = dragHit.x;
    mesh.position.z = dragHit.z;
    mesh.position.y = (mesh.userData.baseY ?? 2) + 0.45;
    mesh.rotation.x = mesh.userData.baseRotX ?? -Math.PI / 2;
    mesh.rotation.y = 0;
  }
}

function endCardDrag(clientX, clientY) {
  if (!dragState) return;
  const p = human();
  const wasDragging = dragState.dragging;
  const zone = dragState.zone;
  const index = dragState.index;
  const minion = dragState.minion;
  const mesh = findDragMesh();
  clearSellTargetHighlight();
  dragState = null;
  if (wasDragging) {
    const inBuyZone = isDropInHandBuyZone(mesh, clientX, clientY);
    const inBoardZone = isDropInBoardPlayZone(mesh);
    const inSupportZone = isDropInSupportPlayZone(mesh);
    if (mesh) {
      mesh.position.x = mesh.userData.baseX ?? mesh.position.x;
      mesh.position.y = mesh.userData.baseY ?? mesh.position.y;
      mesh.position.z = mesh.userData.baseZ ?? mesh.position.z;
      mesh.rotation.x = mesh.userData.baseRotX ?? mesh.rotation.x;
      mesh.rotation.y = mesh.userData.baseRotY ?? 0;
    }
    if (p && zone === 'shop') {
      const shopIdx = p.shop.findIndex(m => m && m.instanceId === minion.instanceId);
      if (shopIdx >= 0 && inBuyZone) {
        if (buyFromShop(p, shopIdx)) {
          log(isSpell(minion) ? `Bought ${minion.category || 'support'} ${minion.name} (${minion.cost} gold) into Hand.` : `Bought ${minion.name} into Hand.`);
          selected = null;
          syncUI();
          renderCards();
          return;
        }
      } else if (shopIdx >= 0) {
        logHint('Drag tavern cards into your Hand to buy.');
      }
      syncUI();
      renderCards();
      return;
    }
    if (p && (zone === 'hand' || zone === 'board' || zone === 'support') && isPointerOverBob(clientX, clientY)) {
      const arr = zone === 'board' ? p.board : zone === 'support' ? (p.support || []) : p.hand;
      const idx = arr.findIndex(m => m && m.instanceId === minion.instanceId);
      if (idx >= 0 && sellMinion(p, zone, idx)) {
        log(`Sold ${minion.name} to the Quartermaster for 1 gold.`);
        selected = null;
        syncUI();
        renderCards();
        return;
      }
    }
    if (p && zone === 'hand' && (inBoardZone || inSupportZone)) {
      const handIdx = p.hand.findIndex(m => m && m.instanceId === minion.instanceId);
      if (handIdx >= 0) {
        if (isSpell(minion)) {
          if (playSpell(p, handIdx)) {
            log(`Played ${minion.name} to Support.`);
            selected = null;
          }
          syncUI();
          renderCards();
          return;
        }
        if (inBoardZone || inSupportZone) {
          const boardIndex = resolveBoardDropIndex(clientX, clientY, minion.instanceId, mesh, p);
          if (playMinion(p, handIdx, boardIndex)) selected = null;
          syncUI();
          renderCards();
          return;
        }
      }
    }
    if (p && zone === 'board' && inBoardZone && !isPointerOverBob(clientX, clientY)) {
      const fromIdx = p.board.findIndex(m => m && m.instanceId === minion.instanceId);
      if (fromIdx >= 0) {
        const toIdx = resolveBoardDropIndex(clientX, clientY, minion.instanceId, mesh, p);
        if (moveBoardCard(p, fromIdx, toIdx)) {
          selected = null;
          log('Reordered board.');
        }
      }
      syncUI();
      renderCards();
      return;
    }
    if (p && zone === 'support' && inSupportZone && !isPointerOverBob(clientX, clientY)) {
      const fromIdx = (p.support || []).findIndex(m => m && m.instanceId === minion.instanceId);
      if (fromIdx >= 0) {
        const toIdx = resolveSupportDropIndex(clientX, clientY, minion.instanceId, mesh, p);
        if (moveSupportCard(p, fromIdx, toIdx)) {
          selected = null;
          log('Reordered support.');
        }
      }
      syncUI();
      renderCards();
      return;
    }
    if (p && zone === 'hand' && !isPointerOverBob(clientX, clientY) && !inBoardZone && !inSupportZone) {
      logHint(isSpell(minion) ? 'Drop on the Support row to play.' : 'Drop on the Unit row to muster.');
    }
    if (p && zone === 'board' && !isPointerOverBob(clientX, clientY) && !inBoardZone) {
      logHint('Drop on the Unit row to reorder, or on the Quartermaster to sell.');
    }
    if (p && zone === 'support' && !isPointerOverBob(clientX, clientY) && !inSupportZone) {
      logHint('Drop on the Support row to reorder, or on the Quartermaster to sell.');
    }
    syncUI();
    renderCards();
    return;
  }
  handleCardClick(zone, index, minion);
}

function handleCardClick(zone, index, minion) {
  const p = human();
  if (!p || !p.alive) return;
  if (zone === 'shop') {
    logHint('Drag tavern cards into your Hand to buy.');
    return;
  } else if (zone === 'hand') {
    if (isSpell(minion)) {
      if (selected && selected.zone === 'hand' && selected.minion.instanceId === minion.instanceId) {
        if (playSpell(p, index)) {
          log(`Played ${minion.name} to Support.`);
          selected = null;
        }
      } else {
        selected = { zone: 'hand', index, minion };
        logHint('Click again to play to Support, or drag onto the Support row.');
      }
    } else {
      selected = { zone: 'hand', index, minion };
      logHint('Drag onto the Unit row to play.');
    }
  } else if (zone === 'board') {
    selected = null;
    logHint('Drag on the Unit row to reorder.');
  } else if (zone === 'support') {
    selected = null;
    logHint('Drag on the Support row to reorder.');
  }
  syncUI();
  renderCards();
}

function onPointerMove(e) {
  if (document.getElementById('codexOverlay')?.classList.contains('open')) return;
  if (dragState) {
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (!dragState.dragging && Math.hypot(dx, dy) > 8) {
      dragState.dragging = true;
      clearCardHover();
      if (dragState.zone === 'shop') {
        logHint('Drop in your Hand to buy.');
      } else if (dragState.zone === 'hand') {
        document.getElementById('tavernMasterFrame').classList.add('sellTarget');
        logHint(isSpell(dragState.minion) ? 'Drop on Support to play, or on the Quartermaster to sell.' : 'Drop on Units to muster, or on the Quartermaster to sell.');
      } else if (dragState.zone === 'board') {
        document.getElementById('tavernMasterFrame').classList.add('sellTarget');
        logHint('Drop on the Unit row to reorder, or on the Quartermaster to sell.');
      } else if (dragState.zone === 'support') {
        document.getElementById('tavernMasterFrame').classList.add('sellTarget');
        logHint('Drop on the Support row to reorder, or on the Quartermaster to sell.');
      } else {
        document.getElementById('tavernMasterFrame').classList.add('sellTarget');
        logHint('Drop into Hand to buy.');
      }
    }
    if (dragState.dragging) {
      updateDragCardPosition(e.clientX, e.clientY);
      if (dragState.zone === 'hand' || dragState.zone === 'board' || dragState.zone === 'support') {
        document.getElementById('tavernMasterFrame').classList.toggle('sellHot', isPointerOverBob(e.clientX, e.clientY));
      }
      return;
    }
  }
  const handTarget = findHandCardAtPointer(e.clientX, e.clientY);
  let obj = handTarget;
  let hitPoint = null;
  if (!obj) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(cardMeshes.concat(stageMeshes), true);
    obj = resolveCardHit(hits);
    if (obj && obj.userData.zone === 'hand') obj = null;
    if (obj) hitPoint = hits[0].point;
  }
  if (!obj || obj.userData.faceDown || obj.userData.zone === 'enemyHand') {
    clearCardHover({ keepTooltip: isPointerOverStageCard(e.clientX, e.clientY) });
    return;
  }
  if (hoveredCard !== obj) {
    resetCardHoverVisual(hoveredCard);
    hoveredCard = obj;
  }
  if (hitPoint) applyCardHoverTilt(obj, hitPoint);
  if (obj.userData.zone === 'stage') {
    showStageMeshTooltip(obj, e.clientX, e.clientY);
    return;
  }
  showTooltipFor(obj.userData.minion, obj, e.clientX, e.clientY);
}

function onPointerDown(e) {
  const you = human();
  if (phase !== 'recruit' || pendingDiscover || !you || !you.alive) return;
  if (e.button != null && e.button !== 0) return;
  let obj = findHandCardAtPointer(e.clientX, e.clientY);
  if (!obj) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(cardMeshes, true);
    obj = resolveCardHit(hits);
    if (obj && obj.userData.zone === 'hand') obj = findHandCardAtPointer(e.clientX, e.clientY);
  }
  if (!obj) { selected = null; syncUI(); renderCards(); return; }
  const { minion, zone, index } = obj.userData;
  if ((zone === 'hand' || zone === 'board' || zone === 'support' || zone === 'shop') && minion) {
    dragState = {
      zone,
      index,
      minion,
      instanceId: minion.instanceId,
      startX: e.clientX,
      startY: e.clientY,
      dragging: false
    };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  handleCardClick(zone, index, minion);
}

function onPointerUp(e) {
  if (!dragState) return;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  endCardDrag(e.clientX, e.clientY);
}

function showTitleScreen() {
  phase = 'title';
  setGameUiVisible(false);
  document.getElementById('overlay').classList.remove('hidden');
  const box = document.getElementById('overlayContent');
  box.innerHTML = `<h1 class="titleLogo">Flag Bearer</h1><button class="primary beginBtn" id="btnBegin">Begin</button>`;
  document.getElementById('btnBegin').onclick = () => startHeroDraft();
}

function startHeroDraft() {
  phase = 'draft';
  setGameUiVisible(false);
  document.getElementById('overlay').classList.remove('hidden');
  const draftPool = HERO_DB.slice().sort(() => Math.random() - 0.5);
  let humanOptions = draftPool.slice(0, 3);
  let rerollUsed = false;
  const box = document.getElementById('overlayContent');

  function renderLordDraft() {
    box.innerHTML = `<h1 class="chooseLord">Choose your Lord</h1><div class="heroGrid"></div><button id="btnRerollLords" type="button"${rerollUsed ? ' disabled' : ''}>${rerollUsed ? 'Reroll Used' : 'Reroll All'}</button>`;
    const grid = box.querySelector('.heroGrid');
    humanOptions.forEach(hero => {
      const el = document.createElement('div');
      el.className = 'heroCard';
      const art = heroPortraitArt(hero);
      el.innerHTML = `<img class="portrait" src="${art}" alt="${escapeHtml(hero.name)}"><h3>${escapeHtml(hero.name)}</h3><div class="meta">${escapeHtml(hero.nation)} · Armor ${hero.armor}</div><div class="power"><strong>${escapeHtml(hero.power.name)}</strong> (${hero.power.cost} Gold)<br>${escapeHtml(hero.power.text)}</div>`;
      el.onclick = () => beginMatch(hero, draftPool);
      grid.appendChild(el);
    });
    const rerollBtn = document.getElementById('btnRerollLords');
    if (!rerollUsed) {
      rerollBtn.onclick = () => {
        const currentIds = new Set(humanOptions.map(h => h.id));
        let next = draftPool.filter(h => !currentIds.has(h.id)).sort(() => Math.random() - 0.5).slice(0, 3);
        if (next.length < 3) {
          next = HERO_DB.filter(h => !currentIds.has(h.id)).sort(() => Math.random() - 0.5).slice(0, 3);
        }
        if (next.length) humanOptions = next;
        rerollUsed = true;
        renderLordDraft();
      };
    }
  }

  renderLordDraft();
}

function beginMatch(humanHero, allHeroes) {
  const players = [];
  players.push(createPlayer(humanHero, true, 0));
  const remaining = allHeroes.filter(h => h.id !== humanHero.id).sort(() => Math.random() - 0.5);
  for (let i = 0; i < 7; i++) {
    const options = remaining.splice(0, 2);
    const pool = options.length ? options : HERO_DB.filter(h => !players.some(p => p.hero.id === h.id)).slice(0, 2);
    players.push(createPlayer(aiChooseHero(pool.length ? pool : HERO_DB), false, i + 1));
  }
  state = {
    players,
    pool: buildPool(),
    turn: 1,
    pendingPairs: null,
    pendingGhosts: null,
    nextOpponentId: null
  };
  discoverQueue = [];
  pendingDiscover = null;
  selected = null;
  logs.length = 0;
  setHistoryOpen(false);
  closeCodex();
  renderHistoryPanel();
  document.getElementById('overlay').classList.add('hidden');
  setGameUiVisible(true);
  log('Match started. Muster units, upgrade your tavern, and survive.');
  beginRecruitPhase();
}

document.getElementById('btnRefresh').onclick = () => {
  const p = human();
  if (p.gold < REFRESH_COST) { log('Not enough gold to refresh.'); return; }
  if (refreshShop(p)) { log('Refreshed the Tavern.'); syncUI(); renderCards(); }
};
document.getElementById('btnUpgrade').onclick = () => {
  const p = human();
  if (p.tavernTier >= 6) { log('Already at max tavern tier.'); return; }
  if (p.gold < p.upgradeCost) { log(`Need ${p.upgradeCost} gold to upgrade.`); return; }
  if (upgradeTavern(p)) { syncUI(); renderCards(); }
};
document.getElementById('btnFreeze').onclick = () => {
  const p = human();
  p.frozen = !p.frozen;
  log(p.frozen ? 'Tavern frozen for next turn.' : 'Tavern unfrozen.');
  syncUI();
  renderCards();
};
document.getElementById('btnHeroPower').onclick = () => {
  const p = human();
  if (p.heroPowerUses <= 0) { log('Lord power already used.'); return; }
  if (p.gold < p.hero.power.cost) { log('Not enough gold for Lord power.'); return; }
  if (useHeroPower(p)) { syncUI(); renderCards(); }
};
bindHoverTooltip(document.getElementById('btnUpgrade'), showUpgradeHover);
bindHoverTooltip(document.getElementById('btnRefresh'), showRefreshHover);
bindHoverTooltip(document.getElementById('btnFreeze'), showFreezeHover);
document.getElementById('btnHistory').onclick = () => setHistoryOpen(!historyOpen);
bindHoverTooltip(document.getElementById('btnEnd'), showEndTurnHover);
document.getElementById('btnCodex').onclick = () => {
  if (document.getElementById('codexOverlay').classList.contains('open')) closeCodex();
  else openCodex(codexTab);
};
document.getElementById('btnCloseCodex').onclick = () => closeCodex();
document.getElementById('codexTabUnits').onclick = () => {
  codexTab = 'units';
  renderCodexBody();
};
document.getElementById('codexTabSpells').onclick = () => {
  codexTab = 'spells';
  renderCodexBody();
};
document.getElementById('codexTabHeroes').onclick = () => {
  codexTab = 'heroes';
  renderCodexBody();
};
document.getElementById('codexOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'codexOverlay') closeCodex();
});
document.getElementById('btnClosePeek').onclick = () => closePeek();
document.getElementById('btnEnd').onclick = async () => {
  if (phase !== 'recruit' || pendingDiscover) return;
  const you = human();
  if (!you || !you.alive) return;
  const unplayed = you.hand.filter(c => !isSpell(c)).length;
  if (unplayed > 0) {
    log(`${unplayed} minion(s) left in Hand — only Board minions fight.`);
  }
  phase = 'ending';
  setControlsEnabled(false);
  closePeek();
  document.getElementById('phaseRow').classList.remove('show');
  document.getElementById('phaseBanner').textContent = '';
  document.querySelectorAll('.tavernSide').forEach(el => el.classList.remove('show'));
  document.getElementById('tavernMasterFrame').classList.remove('show');
  document.getElementById('combatEnemyFrame').classList.remove('show');
  log('Opponents taking their turns...');
  await sleep(350);
  for (const p of state.players) {
    if (!p.alive || p.isHuman) continue;
    aiRecruit(p);
  }
  log('Opponents finished recruiting.');
  await runCombatPhase();
};

window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('resize', () => {
  syncViewportCamera();
  syncStageCardSize();
  syncStageMeshes();
  handOverlayNeedsSync = true;
  portraitBlockDirty = true;
  syncHandOverlayLayer();
  if (phase === 'combat') {
    const foe = getCombatEnemy();
    syncEnemyHandOverlay(foe?.hand || []);
  }
});

function animate() {
  requestAnimationFrame(animate);
  if (document.hidden) return;
  updateHandHoverAnimation();
  syncStageMeshLayout();
  if (combatAnim) {
    combatAnim.t = (combatAnim.t || 0) + 0.08;
    const dyingIds = combatAnim.dyingIds || [];
    const attackerId = combatAnim.attackerId || null;
    if (attackerId || dyingIds.length) {
      for (let i = 0; i < cardGroup.children.length; i++) {
        const c = cardGroup.children[i];
        if (c === hoveredCard || c.userData.zone === 'hand') continue;
        const id = c.userData.minion?.instanceId;
        const isAttacker = !!(attackerId && id === attackerId);
        const isDying = dyingIds.includes(id);
        if (!isAttacker && !isDying) continue;
        const baseY = c.userData.baseY ?? c.position.y;
        const baseZ = c.userData.baseZ ?? c.position.z;
        const ampY = isDying ? 0.045 : 0.035;
        const ampZ = isDying ? 0.11 : 0.09;
        const speed = isDying ? 12 : 9;
        c.position.y = baseY + Math.sin(combatAnim.t * speed) * ampY;
        c.position.z = baseZ + Math.sin(combatAnim.t * speed) * ampZ;
      }
    }
  }
  renderer.render(scene, camera);
}

syncStageCardSize();
animate();
showTitleScreen();
</script>
