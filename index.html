<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flag Bearer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;color:#f2e8d5;font-family:'Source Sans 3',sans-serif;user-select:none}
#gameCanvas{position:fixed;inset:0;display:block;z-index:1}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column}
#ui>*{pointer-events:none}
#ui button,#ui .opp,#ui #opponents,#ui #peekPanel,#ui #topRightActions,#ui #historyPanel,#ui #goldPanel,#ui #btnEnd,#ui #tavernMasterFrame,#ui #combatEnemyFrame,#ui #stagePortraitSlot,#ui .tavernSide{pointer-events:auto}
#playerPortraitSlot{position:fixed;left:50%;bottom:168px;transform:translateX(-50%);z-index:12;width:102px;height:102px;pointer-events:none}
#playerPortraitSlot .playerSide,#playerPortraitSlot #playerHeroFrame{pointer-events:auto}
#handOverlay{position:fixed;inset:0;z-index:16;pointer-events:none;display:none}
#handOverlay.show{display:block}
.handOverlayCard{position:absolute;transform:translate(-50%,-50%);transform-origin:center center;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));z-index:1}
.handOverlayCard.raised{filter:drop-shadow(0 16px 28px rgba(0,0,0,.55))}
.handOverlayCard canvas{display:block;width:100%;height:100%;border-radius:12px;border:1px solid rgba(212,175,90,.4);background:#0c1018}
#enemyHandOverlay{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:16;display:none;pointer-events:none;flex-direction:row;align-items:flex-end;justify-content:center}
#enemyHandOverlay.show{display:flex}
.enemyHandOverlayCard{flex:0 0 auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));margin-left:0}
.enemyHandOverlayCard + .enemyHandOverlayCard{margin-left:var(--enemy-hand-overlap, -40px)}
.enemyHandOverlayCard canvas{display:block;width:100%;height:100%;border-radius:12px;border:1px solid rgba(212,175,90,.35);background:#0c1018}
.panel{background:rgba(12,16,24,.82);border:1px solid rgba(212,175,90,.35);backdrop-filter:blur(6px);border-radius:10px;padding:10px 14px}
#topStack{position:relative;z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 12px 0;width:100%;flex:0 0 auto}
#topRightActions{position:fixed;top:12px;right:14px;z-index:17;display:flex;gap:8px;align-items:center}
#historyPanel{position:fixed;top:52px;right:14px;z-index:17;width:min(300px,42vw);max-height:min(52vh,480px);overflow-x:hidden;overflow-y:auto;display:none;font-size:12px;color:#d7cbb0;line-height:1.4;scrollbar-width:thin}
#historyPanel.open{display:block}
#historyPanel .empty{color:#b9a888;font-style:italic}
#historyPanel .entry{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(212,175,90,.15)}
#historyPanel .entry:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
#codexOverlay{position:fixed;inset:0;background:rgba(5,7,12,.9);display:none;align-items:center;justify-content:center;z-index:25;padding:18px}
#codexOverlay.open{display:flex}
.codexBox{width:min(1100px,96vw);max-height:92vh;display:flex;flex-direction:column;background:radial-gradient(circle at top,#2a2114 0%,#12161f 55%,#0b0e14 100%);border:1px solid rgba(212,175,90,.45);border-radius:14px;overflow:hidden}
.codexHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(212,175,90,.25);flex-wrap:wrap}
.codexHeader h1{font-family:Cinzel,serif;font-size:28px;color:#e0b85a;margin:0}
.codexTabs{display:flex;gap:8px;align-items:center}
.codexTabs button.active{box-shadow:inset 0 0 0 1px #e0b85a;color:#e0b85a;border-color:#e0b85a}
#codexBody{overflow:auto;padding:16px 18px 22px;text-align:left}
.codexRace{margin-bottom:22px}
.codexRace:last-child{margin-bottom:0}
.codexRace h2{font-family:Cinzel,serif;font-size:18px;color:#e0b85a;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(212,175,90,.22);display:flex;align-items:baseline;gap:10px}
.codexRace h2 span{font-family:'Source Sans 3',sans-serif;font-size:12px;color:#b9a888;font-weight:600}
.codexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.codexCard{border:1px solid rgba(212,175,90,.28);border-radius:10px;background:rgba(14,18,28,.92);overflow:hidden;display:flex;flex-direction:column;min-height:210px}
.codexCard .art{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#1a2230}
.codexCard .body{padding:8px 9px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.codexCard .name{font-family:Cinzel,serif;color:#e0b85a;font-size:13px;line-height:1.2}
.codexCard .meta{font-size:11px;color:#9fd8ff;font-weight:700}
.codexCard .text{font-size:11px;color:#d7cbb0;line-height:1.3;margin-top:2px}
.codexHeroCard{border:1px solid rgba(212,175,90,.28);border-radius:10px;background:rgba(14,18,28,.92);overflow:hidden;display:flex;flex-direction:column}
.codexHeroCard .art{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#1a2230}
.codexHeroCard .body{padding:10px 11px 12px}
.codexHeroCard .name{font-family:Cinzel,serif;color:#e0b85a;font-size:15px;margin-bottom:4px}
.codexHeroCard .meta{font-size:12px;color:#b9a888;margin-bottom:8px}
.codexHeroCard .powerName{font-size:12px;color:#9fd8ff;font-weight:700;margin-bottom:3px}
.codexHeroCard .text{font-size:12px;color:#eee2cb;line-height:1.35}
.codexSpellArt{width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 30%,#2a3a5c 0%,#151c2c 55%,#0e1420 100%);border-bottom:1px solid rgba(142,183,255,.25)}
.codexSpellArt .tag{font-family:Cinzel,serif;font-size:11px;letter-spacing:.08em;color:#9fd8ff}
.codexSpellArt .cost{font-family:Cinzel,serif;font-size:36px;font-weight:800;color:#e0b85a;line-height:1}
.codexSpellArt .costLabel{font-size:11px;font-weight:700;color:#b9a888;letter-spacing:.06em}
#opponents{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:14;display:flex;flex-direction:column;gap:10px;align-items:center;max-height:min(78vh,720px);overflow-y:auto;overflow-x:visible;padding:6px 8px;pointer-events:auto;scrollbar-width:thin}
.opp{pointer-events:auto;cursor:pointer;position:relative;width:68px;height:68px;padding:0;border-radius:14px;background:rgba(18,22,32,.95);border:2px solid rgba(212,175,90,.35);overflow:hidden;flex:0 0 auto;transition:border-color .15s,transform .15s,box-shadow .15s}
.opp:hover{border-color:#e0b85a;transform:translateX(3px) scale(1.04);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.opp.dead{opacity:.38;filter:grayscale(.85);pointer-events:auto}
.opp.self{border-color:#6ec6ff}
.opp.combat{border-color:#ff6b5a;box-shadow:0 0 0 2px rgba(255,107,90,.45)}
.opp.peeking{border-color:#9fd8ff;box-shadow:0 0 0 2px rgba(159,216,255,.45)}
.opp .portrait{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.opp .rank{position:absolute;top:4px;left:4px;min-width:22px;height:20px;padding:0 5px;border-radius:8px;background:rgba(10,12,18,.82);border:1px solid rgba(212,175,90,.45);color:#e0b85a;font-family:Cinzel,serif;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
.opp .hpBar{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(8,10,16,.75);pointer-events:none}
.opp .hpBarFill{height:100%;width:100%;background:linear-gradient(90deg,#2f8f5b,#7dcea0);box-shadow:0 0 8px rgba(125,206,160,.35)}
.opp.dead .hpBarFill{background:linear-gradient(90deg,#5a2420,#a05048);box-shadow:none;width:0%!important}
#oppHover{position:fixed;z-index:22;display:none;width:240px;padding:12px 14px;pointer-events:none!important;background:rgba(12,16,24,.96);border:1px solid rgba(212,175,90,.45);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.5)}
#oppHover.show{display:block}
#oppHover .title{font-family:Cinzel,serif;color:#e0b85a;font-size:15px;margin-bottom:4px}
#oppHover .rankLine{font-size:11px;color:#9fd8ff;margin-bottom:8px;letter-spacing:.04em}
#oppHover .line{font-size:12px;color:#eee2cb;line-height:1.4;margin-bottom:3px}
#oppHover .muted{color:#b9a888}
#oppHover .power{margin-top:8px;padding-top:8px;border-top:1px solid rgba(212,175,90,.22);font-size:12px;color:#d7cbb0;line-height:1.35}
#phaseRow{display:none;flex-direction:column;align-items:center;gap:2px;min-height:2.4em;pointer-events:none}
#phaseRow.show{display:flex}
#phaseBanner{font-family:Cinzel,serif;font-size:18px;color:#e0b85a;text-shadow:0 2px 12px rgba(0,0,0,.8);text-align:center}
#playfield{position:relative;flex:1 1 auto;min-height:0;width:100%}
.heroFrame{width:102px;pointer-events:auto}
.heroFrame .portraitWrap{position:relative;width:102px;height:102px;border-radius:18px;overflow:hidden;isolation:isolate;border:2px solid rgba(212,175,90,.45);background:rgba(18,22,32,.95);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.heroFrame .portraitWrap img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:16px}
#stagePortraitSlot{position:absolute;left:50%;top:148px;transform:translateX(-50%);z-index:12;width:102px;height:102px;pointer-events:none}
#stagePortraitCenter{position:relative;width:102px;height:102px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.tavernSide{position:absolute;top:50%;transform:translateY(-50%);display:none;align-items:center;gap:8px;pointer-events:auto;white-space:nowrap}
.tavernSide.show{display:flex}
#tavernSideLeft{right:calc(100% + 14px)}
#tavernSideRight{left:calc(100% + 14px);flex-direction:row}
.playerSide{position:absolute;top:50%;left:calc(100% + 14px);transform:translateY(-50%);display:flex;align-items:center;pointer-events:auto}
#playerHeroFrame{position:relative;width:102px;height:102px;pointer-events:auto}
#playerHeroFrame .portraitWrap{border-color:#6ec6ff}
#btnHeroPower{position:relative;width:102px;height:102px;padding:0;border-radius:18px;overflow:hidden;isolation:isolate;border:2px solid rgba(212,175,90,.55);background:rgba(18,22,32,.95);box-shadow:0 8px 22px rgba(0,0,0,.4);display:block}
#btnHeroPower img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:16px;pointer-events:none}
#btnHeroPower .heroPowerCost{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);min-width:30px;height:30px;padding:0 7px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:15px;font-weight:800;color:#f2e8d5;background:radial-gradient(circle at 35% 30%,#5a3d12 0%,#2a1a08 70%);border:2px solid rgba(224,184,90,.85);box-shadow:0 2px 8px rgba(0,0,0,.55);pointer-events:none;line-height:1}
#tavernMasterFrame,#combatEnemyFrame{display:none}
#tavernMasterFrame.show,#combatEnemyFrame.show{display:block}
#tavernMasterFrame .portraitWrap{border-color:rgba(224,184,90,.65);transition:border-color .15s,box-shadow .15s}
#tavernMasterFrame.sellTarget .portraitWrap{border-color:#7dcea0;box-shadow:0 0 0 2px rgba(125,206,160,.45),0 8px 22px rgba(0,0,0,.4)}
#tavernMasterFrame.sellHot .portraitWrap{border-color:#ffe08a;box-shadow:0 0 0 3px rgba(255,224,138,.55),0 8px 22px rgba(0,0,0,.4)}
#combatEnemyFrame .portraitWrap{border-color:#ff6b5a}
#peekPanel{position:absolute;top:52px;right:12px;width:260px;max-height:calc(100% - 60px);overflow:auto;z-index:13;display:none;pointer-events:auto}
#peekPanel.show{display:block}
#peekPanel h3{font-family:Cinzel,serif;color:#e0b85a;margin-bottom:8px;font-size:15px}
#peekPanel .meta{font-size:12px;color:#b9a888;margin-bottom:10px}
.peekMinion{border:1px solid rgba(212,175,90,.25);border-radius:8px;padding:8px;margin-bottom:6px;background:rgba(8,10,16,.55)}
.peekMinion .title{color:#f2e8d5;font-weight:700;font-size:13px}
.peekMinion .stats{color:#e0b85a;font-size:12px;margin-top:2px}
.peekMinion .text{color:#b9a888;font-size:11px;margin-top:4px;line-height:1.3}
#goldPanel{position:fixed;right:14px;bottom:14px;z-index:15;min-width:92px;text-align:center;pointer-events:auto}
#goldPanel .label{color:#d4af5a;font-family:Cinzel,serif;font-size:11px;letter-spacing:.08em}
#goldPanel .value{font-size:28px;font-weight:700;line-height:1.1;color:#f2e8d5;margin-top:2px}
#btnEnd{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:15;padding:14px 18px;font-size:13px;min-width:108px}
#cardTooltip{position:fixed;z-index:19;display:none;pointer-events:none;filter:drop-shadow(0 14px 32px rgba(0,0,0,.7))}
#cardTooltip.show{display:block}
#cardTooltip canvas{width:min(210px,46vw);height:auto;border-radius:14px;border:1px solid rgba(212,175,90,.45);background:#0c1018}
button{font-family:Cinzel,serif;font-weight:700;letter-spacing:.04em;border:1px solid rgba(212,175,90,.55);background:linear-gradient(180deg,#3a2a14,#1c140a);color:#f2e8d5;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:11px}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:linear-gradient(180deg,#5a3d12,#2a1a08);border-color:#e0b85a}
button.active{box-shadow:inset 0 0 0 1px #6ec6ff;color:#9fd8ff;border-color:#6ec6ff}
button.warn{border-color:#c97b4a}
#overlay{position:fixed;inset:0;background:rgba(5,7,12,.88);display:flex;align-items:center;justify-content:center;z-index:20}
#overlay.hidden{display:none}
.overlayBox{width:min(920px,94vw);max-height:90vh;overflow:auto;background:radial-gradient(circle at top,#2a2114 0%,#12161f 55%,#0b0e14 100%);border:1px solid rgba(212,175,90,.45);border-radius:14px;padding:28px;text-align:center}
.overlayBox h1{font-family:Cinzel,serif;font-size:34px;color:#e0b85a;margin-bottom:8px}
.overlayBox h1.titleLogo{font-size:52px;margin-bottom:28px;letter-spacing:.04em}
.overlayBox h1.chooseLord{font-size:40px;margin-bottom:28px;text-align:center}
.overlayBox .beginBtn{padding:14px 40px;font-size:16px;min-width:160px}
.overlayBox p{color:#c9b896;margin-bottom:18px;line-height:1.45}
.heroGrid,.discoverGrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.heroCard,.discoverCard{width:220px;padding:14px;border-radius:10px;background:rgba(20,24,34,.9);border:1px solid rgba(212,175,90,.35);cursor:pointer;text-align:left}
.heroCard:hover,.discoverCard:hover{border-color:#e0b85a;transform:translateY(-2px)}
.heroCard .portrait{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:14px;margin-bottom:12px;border:2px solid rgba(212,175,90,.4);background:#1a2230}
.heroCard h3,.discoverCard h3{font-family:Cinzel,serif;color:#e0b85a;margin-bottom:6px;font-size:16px}
.heroCard .meta,.discoverCard .meta{font-size:12px;color:#b9a888;margin-bottom:8px}
.heroCard .power,.discoverCard .text{font-size:13px;color:#eee2cb;line-height:1.35}
.hidden{display:none!important}
@media (max-width:900px){
  .opp{width:56px;height:56px;border-radius:12px}
  #opponents{left:8px;gap:8px}
  #stagePortraitSlot,#stagePortraitCenter,#playerPortraitSlot,#playerHeroFrame,#btnHeroPower{width:84px;height:84px}
  #stagePortraitCenter .portraitWrap,#playerHeroFrame .portraitWrap{width:84px;height:84px;border-radius:14px}
  #btnHeroPower{border-radius:14px}
  #btnHeroPower img{border-radius:12px}
  #btnHeroPower .heroPowerCost{min-width:26px;height:26px;font-size:13px;bottom:4px}
  #stagePortraitSlot{top:120px}
  #tavernSideLeft{right:calc(100% + 10px)}
  #tavernSideRight,.playerSide{left:calc(100% + 10px)}
  #playerPortraitSlot{bottom:140px}
  #phaseBanner{font-size:15px}
  #peekPanel{width:220px;top:52px}
  #oppHover{width:210px}
  #cardTooltip canvas{width:min(170px,48vw)}
  #historyPanel{width:min(260px,70vw)}
  .codexHeader h1{font-size:22px}
  .codexGrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .overlayBox h1.titleLogo{font-size:40px}
  .overlayBox h1.chooseLord{font-size:30px}
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="playerPortraitSlot" class="hidden">
  <div id="playerHeroFrame" class="heroFrame">
    <div class="portraitWrap">
      <img id="playerHeroArt" src="" alt="Your Lord">
    </div>
  </div>
  <div class="playerSide">
    <button id="btnHeroPower" type="button" aria-label="Lord Power">
      <img id="heroPowerArt" src="" alt="">
      <span id="heroPowerCost" class="heroPowerCost">0</span>
    </button>
  </div>
</div>
<div id="handOverlay"></div>
<div id="enemyHandOverlay"></div>
<div id="oppHover"></div>
<div id="ui" class="hidden">
  <div id="topStack">
    <div id="phaseRow">
      <div id="phaseBanner"></div>
    </div>
  </div>
  <div id="topRightActions">
    <button id="btnCodex">Codex</button>
    <button id="btnHistory">History</button>
  </div>
  <div id="historyPanel" class="panel">
    <div class="empty">No history yet.</div>
  </div>
  <div id="opponents"></div>
  <div id="cardTooltip"><canvas id="cardTooltipCanvas" width="512" height="716"></canvas></div>
  <div id="playfield">
    <div id="stagePortraitSlot">
      <div id="tavernSideLeft" class="tavernSide">
        <button id="btnUpgrade">Upgrade</button>
      </div>
      <div id="stagePortraitCenter">
        <div id="tavernMasterFrame" class="heroFrame">
          <div class="portraitWrap">
            <img id="tavernMasterArt" src="" alt="Tavern Master">
          </div>
        </div>
        <div id="combatEnemyFrame" class="heroFrame">
          <div class="portraitWrap">
            <img id="combatEnemyArt" src="" alt="Enemy Lord">
          </div>
        </div>
      </div>
      <div id="tavernSideRight" class="tavernSide">
        <button id="btnRefresh">Refresh (1)</button>
        <button id="btnFreeze">Freeze</button>
      </div>
    </div>
    <div id="peekPanel" class="panel">
      <h3 id="peekTitle">Opponent</h3>
      <div class="meta" id="peekMeta"></div>
      <div id="peekList"></div>
      <button id="btnClosePeek" style="width:100%;margin-top:8px">Close</button>
    </div>
  </div>
  <div id="goldPanel" class="panel">
    <div class="label">GOLD</div>
    <div class="value" id="goldVal">0</div>
  </div>
  <button id="btnEnd" class="primary">End Turn</button>
</div>
<div id="overlay">
  <div class="overlayBox" id="overlayContent"></div>
</div>
<div id="codexOverlay">
  <div class="codexBox">
    <div class="codexHeader">
      <h1>Codex</h1>
      <div class="codexTabs">
        <button id="codexTabUnits" class="active">Units</button>
        <button id="codexTabSpells">Spells</button>
        <button id="codexTabHeroes">Lords</button>
      </div>
      <button id="btnCloseCodex">Close</button>
    </div>
    <div id="codexBody"></div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const ART_A = 'Gemini_Generated_Image_bti4bfbti4bfbti4.png';
const ART_B = 'Gemini_Generated_Image_xdwagyxdwagyxdwa.png';
const SHOP_SIZE = [0, 3, 4, 4, 5, 5, 6];
const UPGRADE_BASE = [0, 0, 5, 7, 8, 10, 10];
const COPY_COUNTS = [0, 16, 15, 13, 11, 9, 7];
const BUY_COST = 3;
const REFRESH_COST = 1;
const MAX_GOLD = 10;
const MAX_BOARD = 7;
const MAX_HAND = 10;
const START_HP = 30;
const TRIBES = ['Beast', 'Demon', 'Dragon', 'Elemental', 'Mech', 'Murloc', 'Naga', 'Pirate', 'Quilboar', 'Undead', 'Neutral'];
const KEYWORDS = ['Taunt', 'DivineShield', 'Reborn', 'Poisonous', 'Windfury'];

const NAME_PARTS = {
  Beast: [['Wild', 'Feral', 'Thorn', 'Moss', 'Ironhide'], ['Wolf', 'Boar', 'Raptor', 'Bear', 'Stalker']],
  Demon: [['Fel', 'Abyssal', 'Crimson', 'Void', 'Spite'], ['Fiend', 'Imp', 'Brute', 'Hound', 'Tyrant']],
  Dragon: [['Storm', 'Ember', 'Azure', 'Scale', 'Nether'], ['Whelp', 'Drake', 'Wyrm', 'Guardian', 'Scion']],
  Elemental: [['Molten', 'Frost', 'Thunder', 'Ashen', 'Tide'], ['Spark', 'Golem', 'Spirit', 'Wisp', 'Colossus']],

  Murloc: [['Murky', 'Tide', 'Gill', 'Coral', 'Brack'], ['Fin', 'Oracle', 'Scout', 'Raider', 'King']],

const EFFECT_CATALOG = {
  buffSelf: (ctx, p) => { if (ctx.self) buffMinion(ctx.self, p.attack || 0, p.health || 0); },
  buffFriendlyAll: (ctx, p) => { ctx.friendly.board.forEach(m => buffMinion(m, p.attack || 0, p.health || 0)); },
  buffFriendlyTribe: (ctx, p) => {
    for (const m of ctx.friendly.board) {
      if (m.tribe === p.tribe) buffMinion(m, p.attack || 0, p.health || 0);
    }
  },
  buffRandomFriendly: (ctx, p) => {
    const live = ctx.friendly.board.filter(m => m.health > 0 && m !== ctx.self);
    if (!live.length) return;
    buffMinion(pick(live), p.attack || 0, p.health || 0);
  },
  giveKeywordFriendly: (ctx, p) => {
    const board = ctx.friendly.board.filter(m => m && m.health > 0);
    const targets = p.all ? board : board.filter(m => m !== ctx.self);
    if (!targets.length) return;
    const t = p.all ? targets : [pick(targets)];
    t.forEach(m => addKeyword(m, p.keyword));
  },
  giveKeywordSelf: (ctx, p) => { if (ctx.self) addKeyword(ctx.self, p.keyword); },
  damageRandomEnemy: (ctx, p) => {
    if (!ctx.enemy) return;
    const live = ctx.enemy.board.filter(m => m.health > 0);
    if (!live.length) return;
    for (let i = 0; i < (p.times || 1); i++) {
      const alive = ctx.enemy.board.filter(m => m.health > 0);
      if (!alive.length) break;
      dealDamageToMinion(pick(alive), p.damage || 1, ctx);
    }
  },
  damageAllEnemy: (ctx, p) => {
    if (!ctx.enemy) return;
    [...ctx.enemy.board].forEach(m => { if (m.health > 0) dealDamageToMinion(m, p.damage || 1, ctx); });
  },
  summonToken: (ctx, p) => {
    const count = p.count || 1;
    for (let i = 0; i < count; i++) {
      if (ctx.friendly.board.length >= MAX_BOARD) break;
      const token = createTokenMinion(p.tokenId || 'token_1_1');
      const base = ctx.selfIndex >= 0 ? ctx.selfIndex : ctx.friendly.board.length;
      const idx = ctx.self ? base + 1 + i : base + i;
      ctx.friendly.board.splice(Math.min(idx, ctx.friendly.board.length), 0, token);
    }
  },
  gainGold: (ctx, p) => { if (!ctx.inCombat) ctx.friendly.gold = Math.min(MAX_GOLD, ctx.friendly.gold + (p.amount || 1)); },
  refreshShop: (ctx) => { if (!ctx.inCombat) refreshShop(ctx.friendly, true); },
  freezeShop: (ctx) => { if (!ctx.inCombat) ctx.friendly.frozen = true; },
  buffShop: (ctx, p) => {
    if (ctx.inCombat) return;
    ctx.friendly.shop.forEach(m => { if (m && !isSpell(m)) buffMinion(m, p.attack || 0, p.health || 0); });
  },
  discoverCurrentTier: (ctx) => {
    if (ctx.inCombat) return;
    queueDiscover(ctx.friendly, ctx.friendly.tavernTier, false);
  },
  healHero: (ctx, p) => { ctx.friendly.hp = Math.min(ctx.friendly.maxHp, ctx.friendly.hp + (p.amount || 1)); },
  damageHero: (ctx, p) => { applyHeroDamage(ctx.enemy || ctx.friendly, p.amount || 1); },
  avengeBuffSelf: (ctx, p) => { if (ctx.self) buffMinion(ctx.self, p.attack || 0, p.health || 0); },
  startBuffAll: (ctx, p) => { ctx.friendly.board.forEach(m => buffMinion(m, p.attack || 0, p.health || 0)); }
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function uid() { return Math.random().toString(36).slice(2, 10); }
function keywordLabel(kw) {
  if (kw === 'DivineShield') return 'Divine Shield';
  return kw;
}

function buffMinion(m, a, h) {
  m.attack += a;
  m.health += h;
  m.maxHealth += h;
}

function addKeyword(m, kw) {
  if (!m.keywords.includes(kw)) m.keywords.push(kw);
}

function hasKeyword(m, kw) {
  return m.keywords.includes(kw);
}

function createCardDatabase() {
  const cards = [];
  const usedNames = new Set();
  const tierTargets = [0, 36, 36, 34, 32, 32, 30];
  let id = 1;
  const effectPoolByTier = {
    1: [

    ],

    5: [

      { keywords: ['Windfury', 'DivineShield'] },
      { startOfCombat: { id: 'damageAllEnemy', params: { damage: 3 } } },
      { avenge: { count: 1, effect: { id: 'buffSelf', params: { attack: 3, health: 3 } } } },
      { keywords: ['Taunt', 'Reborn', 'DivineShield'] }
    ]
  };

  for (let tier = 1; tier <= 6; tier++) {
    let made = 0;
    while (made < tierTargets[tier]) {
      const tribe = TRIBES[made % TRIBES.length];
      const parts = NAME_PARTS[tribe];
      let name = `${pick(parts[0])} ${pick(parts[1])}`;
      let guard = 0;
      while (usedNames.has(name) && guard++ < 50) name = `${pick(parts[0])} ${pick(parts[1])}`;
      if (usedNames.has(name)) name = `${name} ${id}`;
      usedNames.add(name);
      const baseAtk = tier + Math.floor(made % 3);
      const baseHp = tier + 1 + Math.floor((made + 1) % 3);
      const template = effectPoolByTier[tier][made % effectPoolByTier[tier].length];
      const keywords = [...(template.keywords || [])];
      const battlecry = template.battlecry ? { ...template.battlecry, params: { ...template.battlecry.params } } : null;
      if (battlecry && battlecry.id === 'buffFriendlyTribe') battlecry.params.tribe = tribe;
      const deathrattle = template.deathrattle ? { ...template.deathrattle, params: { ...template.deathrattle.params } } : null;
      const startOfCombat = template.startOfCombat ? { ...template.startOfCombat, params: { ...template.startOfCombat.params } } : null;
      const avenge = template.avenge ? { count: template.avenge.count, effect: { ...template.avenge.effect, params: { ...template.avenge.effect.params } } } : null;
      const goldenUpgrade = {
        attackMult: 2,
        healthMult: 2,
        battlecry: battlecry ? scaleEffect(battlecry, 2) : null,
        deathrattle: deathrattle ? scaleEffect(deathrattle, 2) : null,
        startOfCombat: startOfCombat ? scaleEffect(startOfCombat, 2) : null,
        avenge: avenge ? { count: avenge.count, effect: scaleEffect(avenge.effect, 2) } : null
      };
      cards.push({
        id: `minion_${id++}`,
        name,
        tier,
        tribe,
        attack: baseAtk,
        health: baseHp,
        keywords,
        battlecry,
        deathrattle,
        startOfCombat,
        avenge,
        goldenUpgrade,
        art: tribe === 'Neutral' || TRIBES.indexOf(tribe) % 2 === 0 ? ART_A : ART_B,
        isToken: false
      });
      made++;
    }
  }

  const tokens = [
    { id: 'token_1_1', name: 'Spawn', tier: 1, attack: 1, health: 1 },
    { id: 'token_2_2', name: 'Whelp', tier: 1, attack: 2, health: 2 },
    { id: 'token_5_5', name: 'Monstrosity', tier: 3, attack: 5, health: 5 },
    { id: 'token_8_8', name: 'Titan Fragment', tier: 5, attack: 8, health: 8 }
  ];
  for (const t of tokens) {
    cards.push({
      id: t.id,
      name: t.name,
      tier: t.tier,
      tribe: 'Neutral',
      attack: t.attack,
      health: t.health,
      keywords: [],
      battlecry: null,
      deathrattle: null,
      startOfCombat: null,
      avenge: null,
      goldenUpgrade: null,
      art: ART_B,
      isToken: true
    });
  }
  return cards;
}

function scaleEffect(effect, mult) {
  const params = { ...(effect.params || {}) };
  const scaleKeys = new Set(['attack', 'health', 'damage', 'amount', 'count']);
  for (const k of Object.keys(params)) {
    if (typeof params[k] === 'number' && scaleKeys.has(k)) params[k] = params[k] * mult;
  }
  return { id: effect.id, params };
}

function describeCard(def) {
  const bits = [];
  if (def.keywords?.length) bits.push(def.keywords.map(keywordLabel).join(', '));
  if (def.battlecry) bits.push(`Battlecry: ${effectText(def.battlecry)}`);
  if (def.deathrattle) bits.push(`Deathrattle: ${effectText(def.deathrattle)}`);
  if (def.startOfCombat) bits.push(`Start of Combat: ${effectText(def.startOfCombat)}`);
  if (def.avenge) bits.push(`Avenge (${def.avenge.count}): ${effectText(def.avenge.effect)}`);
  return bits.join(' | ') || 'No special ability.';
}

function describeMinion(minion) {
  if (isSpell(minion)) return minion.text || effectText(minion.effect) || 'Tavern spell.';
  const bits = [];
  if (minion.keywords?.length) bits.push(minion.keywords.map(keywordLabel).join(', '));
  if (minion.battlecry) bits.push(`Battlecry: ${effectText(minion.battlecry)}`);
  if (minion.deathrattle) bits.push(`Deathrattle: ${effectText(minion.deathrattle)}`);
  if (minion.startOfCombat) bits.push(`Start of Combat: ${effectText(minion.startOfCombat)}`);
  if (minion.avenge) bits.push(`Avenge (${minion.avenge.count}): ${effectText(minion.avenge.effect)}`);
  if (minion.golden) bits.push('Golden');
  return bits.join(' | ') || 'No special ability.';
}

function effectText(effect) {
  const p = effect.params || {};
  switch (effect.id) {
    case 'buffSelf': return `Gain +${p.attack || 0}/+${p.health || 0}.`;
    case 'buffFriendlyAll': return `Give your minions +${p.attack || 0}/+${p.health || 0}.`;
    case 'buffFriendlyTribe': return `Give your ${p.tribe}s +${p.attack || 0}/+${p.health || 0}.`;
    case 'buffRandomFriendly': return `Give a random friendly minion +${p.attack || 0}/+${p.health || 0}.`;
    case 'giveKeywordFriendly': return p.all ? `Give your minions ${keywordLabel(p.keyword)}.` : `Give a friendly minion ${keywordLabel(p.keyword)}.`;
    case 'giveKeywordSelf': return `Gain ${keywordLabel(p.keyword)}.`;
    case 'damageRandomEnemy': return `Deal ${p.damage} to a random enemy minion${p.times > 1 ? ` ${p.times} times` : ''}.`;
    case 'damageAllEnemy': return `Deal ${p.damage} to all enemy minions.`;
    case 'summonToken': {
      const t = CARD_BY_ID[p.tokenId];
      return `Summon ${p.count || 1} ${t ? t.name : 'token'}.`;
    }
    case 'gainGold': return `Gain ${p.amount} Gold.`;
    case 'refreshShop': return 'Refresh the Tavern.';
    case 'freezeShop': return 'Freeze the Tavern.';
    case 'buffShop': return `Give Tavern minions +${p.attack || 0}/+${p.health || 0}.`;
    case 'discoverCurrentTier': return 'Discover a minion from your tier.';
    case 'healHero': return `Restore ${p.amount} Health.`;
    default: return effect.id;
  }
}

function giveMinionToHand(player, def) {
  if (player.hand.length >= MAX_HAND) return false;
  if ((state.pool[def.id] || 0) <= 0) return false;
  takeFromPool(def.id);
  player.hand.push(createMinionFromDef(def));
  checkTriples(player);
  return true;
}

function createMinionFromDef(def, opts = {}) {
  const golden = !!opts.golden;
  const gu = def.goldenUpgrade;
  const attack = golden && gu ? def.attack * (gu.attackMult || 2) : def.attack;
  const health = golden && gu ? def.health * (gu.healthMult || 2) : def.health;
  return {
    instanceId: uid(),
    cardId: def.id,
    name: golden ? `Golden ${def.name}` : def.name,
    tier: def.tier,
    tribe: def.tribe,
    attack,
    health,
    maxHealth: health,
    keywords: [...def.keywords],
    battlecry: golden && gu?.battlecry ? gu.battlecry : (def.battlecry ? { ...def.battlecry, params: { ...def.battlecry.params } } : null),
    deathrattle: golden && gu?.deathrattle ? gu.deathrattle : (def.deathrattle ? { ...def.deathrattle, params: { ...def.deathrattle.params } } : null),
    startOfCombat: golden && gu?.startOfCombat ? gu.startOfCombat : (def.startOfCombat ? { ...def.startOfCombat, params: { ...def.startOfCombat.params } } : null),
    avenge: golden && gu?.avenge ? gu.avenge : (def.avenge ? { count: def.avenge.count, effect: { ...def.avenge.effect, params: { ...def.avenge.effect.params } }, progress: 0 } : null),
    art: def.art,
    golden,
    isToken: !!def.isToken,
    divineShield: def.keywords.includes('DivineShield'),
    rebornActive: def.keywords.includes('Reborn'),
    attacksRemaining: def.keywords.includes('Windfury') ? 2 : 1
  };
}

function createTokenMinion(tokenId) {
  const def = CARD_BY_ID[tokenId] || CARD_BY_ID.token_1_1;
  return createMinionFromDef(def);
}

function cloneMinion(m, freshId = false) {
  return {
    ...m,
    keywords: [...m.keywords],
    battlecry: m.battlecry ? { ...m.battlecry, params: { ...m.battlecry.params } } : null,
    deathrattle: m.deathrattle ? { ...m.deathrattle, params: { ...m.deathrattle.params } } : null,
    startOfCombat: m.startOfCombat ? { ...m.startOfCombat, params: { ...m.startOfCombat.params } } : null,
    avenge: m.avenge ? { count: m.avenge.count, effect: { ...m.avenge.effect, params: { ...m.avenge.effect.params } }, progress: m.avenge.progress || 0 } : null,
    instanceId: freshId ? uid() : m.instanceId
  };
}

function cloneBoard(board) {
  return board.map(cloneMinion);
}

let state = null;
let discoverQueue = [];
let pendingDiscover = null;
let selected = null;
let phase = 'boot';
let combatAnim = null;
let peekPlayerId = null;

const logs = [];
let historyOpen = false;

function renderHistoryPanel() {
  const el = document.getElementById('historyPanel');
  if (!el) return;
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 48;
  if (!logs.length) {
    el.innerHTML = '<div class="empty">No history yet.</div>';
    return;
  }
  el.innerHTML = logs.map(x => `<div class="entry">${escapeHtml(x)}</div>`).join('');
  if (nearBottom) el.scrollTop = el.scrollHeight;
}

function log(msg) {
  if (!msg) return;
  logs.push(msg);
  if (logs.length > 80) logs.shift();
  renderHistoryPanel();
}

function logHint(msg) {
  if (!msg) return;
  if (logs.length && logs[logs.length - 1] === msg) return;
  log(msg);
}

function setHistoryOpen(open) {
  historyOpen = !!open;
  const panel = document.getElementById('historyPanel');
  panel.classList.toggle('open', historyOpen);
  document.getElementById('btnHistory').classList.toggle('active', historyOpen);
  document.getElementById('btnHistory').textContent = historyOpen ? 'Close History' : 'History';
  if (historyOpen) panel.scrollTop = panel.scrollHeight;
}

let codexTab = 'units';

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderCodexUnits() {
  const units = CARD_DB.filter(c => !c.isToken).slice().sort((a, b) => {
    if (a.tribe !== b.tribe) return TRIBES.indexOf(a.tribe) - TRIBES.indexOf(b.tribe);
    if (a.tier !== b.tier) return a.tier - b.tier;
    return a.name.localeCompare(b.name);
  });
  const byTribe = new Map();
  for (const tribe of TRIBES) byTribe.set(tribe, []);
  for (const card of units) {
    if (!byTribe.has(card.tribe)) byTribe.set(card.tribe, []);
    byTribe.get(card.tribe).push(card);
  }
  return [...byTribe.entries()].filter(([, list]) => list.length).map(([tribe, list]) => {
    const cards = list.map(card => `
      <div class="codexCard">
        <img class="art" src="${card.art}" alt="${escapeHtml(card.name)}">
        <div class="body">
          <div class="name">${escapeHtml(card.name)}</div>
          <div class="meta">${card.attack}/${card.health} · Tier ${card.tier}</div>
          <div class="text">${escapeHtml(describeCard(card))}</div>
        </div>
      </div>
    `).join('');
    return `<section class="codexRace"><h2>${escapeHtml(tribe)} <span>${list.length}</span></h2><div class="codexGrid">${cards}</div></section>`;
  }).join('');
}

function renderCodexHeroes() {
  const cards = HERO_DB.map((hero, i) => {
    const art = i % 2 === 0 ? ART_A : ART_B;
    return `
      <div class="codexHeroCard">
        <img class="art" src="${art}" alt="${escapeHtml(hero.name)}">
        <div class="body">
          <div class="name">${escapeHtml(hero.name)}</div>
          <div class="meta">Armor ${hero.armor}</div>
          <div class="powerName">${escapeHtml(hero.power.name)} (${hero.power.cost} Gold)</div>
          <div class="text">${escapeHtml(hero.power.text)}</div>
        </div>
      </div>
    `;
  }).join('');
  return `<section class="codexRace"><h2>Lords <span>${HERO_DB.length}</span></h2><div class="codexGrid">${cards}</div></section>`;
}

function renderCodexSpells() {
  const spells = SPELL_DB.slice().sort((a, b) => {
    if (a.tier !== b.tier) return a.tier - b.tier;
    if (a.cost !== b.cost) return a.cost - b.cost;
    return a.name.localeCompare(b.name);
  });
  const byTier = new Map();
  for (const spell of spells) {
    if (!byTier.has(spell.tier)) byTier.set(spell.tier, []);
    byTier.get(spell.tier).push(spell);
  }
  return [...byTier.entries()].map(([tier, list]) => {
    const cards = list.map(spell => `
      <div class="codexCard">
        <div class="codexSpellArt" aria-hidden="true">
          <div class="tag">TAVERN SPELL</div>
          <div class="cost">${spell.cost}</div>
          <div class="costLabel">GOLD</div>
        </div>
        <div class="body">
          <div class="name">${escapeHtml(spell.name)}</div>
          <div class="meta">Tier ${spell.tier} · ${spell.cost} Gold</div>
          <div class="text">${escapeHtml(spell.text || effectText(spell.effect) || 'Tavern spell.')}</div>
        </div>
      </div>
    `).join('');
    return `<section class="codexRace"><h2>Tier ${tier} <span>${list.length}</span></h2><div class="codexGrid">${cards}</div></section>`;
  }).join('');
}

function renderCodexBody() {
  const body = document.getElementById('codexBody');
  if (codexTab === 'heroes') body.innerHTML = renderCodexHeroes();
  else if (codexTab === 'spells') body.innerHTML = renderCodexSpells();
  else body.innerHTML = renderCodexUnits();
  document.getElementById('codexTabUnits').classList.toggle('active', codexTab === 'units');
  document.getElementById('codexTabSpells').classList.toggle('active', codexTab === 'spells');
  document.getElementById('codexTabHeroes').classList.toggle('active', codexTab === 'heroes');
}

function openCodex(tab = 'units') {
  codexTab = tab === 'heroes' || tab === 'spells' ? tab : 'units';
  setHistoryOpen(false);
  renderCodexBody();
  document.getElementById('codexOverlay').classList.add('open');
  document.getElementById('btnCodex').classList.add('active');
}

function closeCodex() {
  document.getElementById('codexOverlay').classList.remove('open');
  document.getElementById('btnCodex').classList.remove('active');
}

function compactShop(player) {
  player.shop = player.shop.filter(Boolean);
}

function queueDiscover(player, tier, fromTriple) {
  if (player.hand.length >= MAX_HAND) {
    if (player.isHuman) log('Hand is full — discover skipped.');
    return;
  }
  if (!player.isHuman) {
    const options = drawDiscoverOptions(tier, 3);
    if (options.length) {
      const choice = pick(options);
      if (giveMinionToHand(player, choice)) log(`${player.name} discovered ${choice.name}.`);
    }
    return;
  }
  discoverQueue.push({ player, tier, fromTriple });
  if (!pendingDiscover) showNextDiscover();
}

function drawDiscoverOptions(tier, count) {
  const t = clamp(tier, 1, 6);
  const options = [];
  const available = [];
  for (const [cardId, copies] of Object.entries(state.pool)) {
    if (copies <= 0) continue;
    const def = CARD_BY_ID[cardId];
    if (!def || def.isToken || def.tier !== t) continue;
    for (let i = 0; i < copies; i++) available.push(def);
  }
  for (let i = 0; i < count && available.length; i++) {
    const idx = Math.floor(Math.random() * available.length);
    const def = available.splice(idx, 1)[0];
    if (!options.find(o => o.id === def.id)) options.push(def);
    else i--;
  }
  return options;
}

function showNextDiscover() {
  if (!discoverQueue.length) {
    pendingDiscover = null;
    return;
  }
  pendingDiscover = discoverQueue.shift();
  if (pendingDiscover.player.hand.length >= MAX_HAND) {
    pendingDiscover = null;
    showNextDiscover();
    return;
  }
  const options = drawDiscoverOptions(pendingDiscover.tier, 3).filter(def => (state.pool[def.id] || 0) > 0);
  const box = document.getElementById('overlayContent');
  document.getElementById('overlay').classList.remove('hidden');
  box.innerHTML = `<h1>Discover</h1><p>${pendingDiscover.fromTriple ? 'Triple reward: choose a minion from the next Tavern Tier.' : 'Choose a minion.'}</p><div class="discoverGrid"></div>`;
  const grid = box.querySelector('.discoverGrid');
  options.forEach(def => {
    const el = document.createElement('div');
    el.className = 'discoverCard';
    el.innerHTML = `<h3>${def.name}</h3><div class="meta">T${def.tier} ${def.tribe} · ${def.attack}/${def.health}</div><div class="text">${describeCard(def)}</div>`;
    el.onclick = () => {
      const p = pendingDiscover.player;
      if (!giveMinionToHand(p, def)) {
        log('Could not take that minion.');
        return;
      }
      log(`Discovered ${def.name}.`);
      document.getElementById('overlay').classList.add('hidden');
      pendingDiscover = null;
      syncUI();
      renderCards();
      showNextDiscover();
    };
    grid.appendChild(el);
  });
  if (!options.length) {
    document.getElementById('overlay').classList.add('hidden');
    pendingDiscover = null;
    showNextDiscover();
  }
}

function buildPool() {
  const pool = {};
  for (const c of CARD_DB) {
    if (c.isToken) continue;
    pool[c.id] = COPY_COUNTS[c.tier];
  }
  return pool;
}

function takeFromPool(cardId) {
  if (state.pool[cardId] > 0) state.pool[cardId]--;
}

function returnToPool(card) {
  if (!card || card.isToken || card.golden || card.kind === 'spell') return;
  if (state.pool[card.cardId] !== undefined) state.pool[card.cardId]++;
}

function isSpell(card) {
  return !!card && card.kind === 'spell';}

function createSpellCard(def) {
  return {
    kind: 'spell',
    instanceId: uid(),
    cardId: def.id,
    name: def.name,
    tier: def.tier,
    cost: def.cost,
    attack: 0,
    health: 0,
    tribe: 'Spell',
    keywords: [],
    effect: { ...def.effect, params: { ...(def.effect.params || {}) } },
    text: def.text,
    art: def.tier % 2 === 0 ? ART_A : ART_B,
    golden: false,
    isToken: false
  };
}

function weightedDrawSpell(maxTier) {
  const bag = [];
  for (const def of SPELL_DB) {
    if (def.tier > maxTier) continue;
    const copies = SPELL_COPIES[def.tier] || 1;
    for (let i = 0; i < copies; i++) bag.push(def);
  }
  if (!bag.length) return null;
  return createSpellCard(pick(bag));
}

function weightedDraw(maxTier) {
  const bag = [];
  for (const [cardId, copies] of Object.entries(state.pool)) {
    if (copies <= 0) continue;
    const def = CARD_BY_ID[cardId];
    if (!def || def.isToken || def.tier > maxTier) continue;
    for (let i = 0; i < copies; i++) bag.push(cardId);
  }
  if (!bag.length) return null;
  const cardId = pick(bag);
  takeFromPool(cardId);
  return createMinionFromDef(CARD_BY_ID[cardId]);
}

function stockTavern(player, preserveFrozen = false) {
  const size = SHOP_SIZE[player.tavernTier];
  if (preserveFrozen && player.frozen) {
    player.shop = player.shop.filter(Boolean);
    const frozenSpellIdx = player.shop.findIndex(isSpell);
    const frozenSpell = frozenSpellIdx >= 0 ? player.shop[frozenSpellIdx] : null;
    player.shop = player.shop.filter(c => !isSpell(c));
    while (player.shop.length < size) {
      const m = weightedDraw(player.tavernTier);
      if (!m) break;
      player.shop.push(m);
    }
    if (frozenSpell) player.shop.splice(Math.min(frozenSpellIdx, player.shop.length), 0, frozenSpell);
    else {
      const spell = weightedDrawSpell(player.tavernTier);
      if (spell) player.shop.push(spell);
    }
    player.frozen = false;
    return;
  }
  for (const c of player.shop) if (c) returnToPool(c);
  player.shop = [];
  player.frozen = false;
  while (player.shop.length < size) {
    const m = weightedDraw(player.tavernTier);
    if (!m) break;
    player.shop.push(m);
  }
  const spell = weightedDrawSpell(player.tavernTier);
  if (spell) player.shop.push(spell);
}

function refreshShop(player, free = false) {
  if (!free) {
    if (player.gold < REFRESH_COST) return false;
    player.gold -= REFRESH_COST;
  }
  stockTavern(player, false);
  return true;
}

function getTavernGoldForTurn(turn) {
  return Math.min(MAX_GOLD, 2 + turn);
}

function replenishTavernGold(player) {
  player.gold = getTavernGoldForTurn(state.turn);
}

function startRecruitForPlayer(player) {
  replenishTavernGold(player);
  if (state.turn > 1) player.upgradeCost = Math.max(0, player.upgradeCost - 1);
  player.heroPowerUses = player.hero.power.uses;
  stockTavern(player, true);
}

function upgradeTavern(player) {
  if (player.tavernTier >= 6) return false;
  if (player.gold < player.upgradeCost) return false;
  player.gold -= player.upgradeCost;
  player.tavernTier++;
  player.upgradeCost = UPGRADE_BASE[player.tavernTier + 1] || 0;
  log(`${player.name} upgraded to Tier ${player.tavernTier}.`);
  return true;
}

function buyFromShop(player, shopIndex, quiet = false) {
  const card = player.shop[shopIndex];
  if (!card) return false;
  const price = isSpell(card) ? card.cost : BUY_COST;
  if (player.gold < price) {
    if (!quiet && player.isHuman) log(`Not enough gold (need ${price}).`);
    return false;
  }
  if (player.hand.length >= MAX_HAND) {
    if (!quiet && player.isHuman) log('Your hand is already full.');
    return false;
  }
  player.gold -= price;
  player.shop.splice(shopIndex, 1);
  compactShop(player);
  player.hand.push(card);
  if (!isSpell(card)) checkTriples(player);
  return true;
}

function buyMinion(player, shopIndex, quiet = false) {
  return buyFromShop(player, shopIndex, quiet);
}

function sellMinion(player, from, index, quiet = false) {
  const arr = from === 'board' ? player.board : from === 'hand' ? player.hand : null;
  if (!arr) {
    if (!quiet && player.isHuman) logHint('Drag a hand or board card onto Bartender Bob to sell.');
    return false;
  }
  const m = arr[index];
  if (!m) return false;
  if (from === 'board' && isSpell(m)) return false;
  arr.splice(index, 1);
  player.gold = Math.min(MAX_GOLD, player.gold + 1);
  returnToPool(m);
  return true;
}

function playSpell(player, handIndex, quiet = false) {
  const spell = player.hand[handIndex];
  if (!isSpell(spell)) return false;
  if (spell.effect?.id === 'summonToken' && player.board.length >= MAX_BOARD) {
    if (!quiet && player.isHuman) log('Board is full.');
    return false;
  }
  if (spell.effect?.id === 'buffRandomFriendly' && !player.board.length) {
    if (!quiet && player.isHuman) log('No minion to buff.');
    return false;
  }
  if (spell.effect?.id === 'giveKeywordFriendly' && !player.board.length) {
    if (!quiet && player.isHuman) log('No minion to enchant.');
    return false;
  }
  player.hand.splice(handIndex, 1);
  runEffect(spell.effect, {
    friendly: player,
    enemy: null,
    self: null,
    selfIndex: -1,
    inCombat: false
  });
  return true;
}

function playMinion(player, handIndex, boardIndex = player.board.length, quiet = false) {
  const m = player.hand[handIndex];
  if (!m) return false;
  if (isSpell(m)) return playSpell(player, handIndex, quiet);
  if (player.board.length >= MAX_BOARD) {
    if (!quiet && player.isHuman) log(`Board is full (${MAX_BOARD} minions).`);
    return false;
  }
  player.hand.splice(handIndex, 1);
  const idx = clamp(boardIndex, 0, player.board.length);
  player.board.splice(idx, 0, m);
  if (m.battlecry) {
    runEffect(m.battlecry, {
      friendly: player,
      enemy: null,
      self: m,
      selfIndex: idx,
      inCombat: false
    });
    if (!quiet && player.isHuman) {
      const text = effectText(m.battlecry);
      log(`${m.name} Battlecry: ${text}`);
    }
  } else if (!quiet && player.isHuman) {
    log(`Played ${m.name} to the Board.`);
  }
  return true;
}

function checkTriples(player) {
  const counts = {};
  const locations = {};
  const track = (m, where, index) => {
    if (!m || m.golden || m.isToken || isSpell(m)) return;
    counts[m.cardId] = (counts[m.cardId] || 0) + 1;
    if (!locations[m.cardId]) locations[m.cardId] = [];
    locations[m.cardId].push({ where, index, m });
  };
  player.board.forEach((m, i) => track(m, 'board', i));
  player.hand.forEach((m, i) => track(m, 'hand', i));
  for (const cardId of Object.keys(counts)) {
    if (counts[cardId] < 3) continue;
    const locs = locations[cardId].slice(0, 3);
    const boardConsumed = locs.filter(l => l.where === 'board').length;
    const handRoom = player.hand.length - (3 - boardConsumed) < MAX_HAND;
    const boardRoom = player.board.length - boardConsumed < MAX_BOARD;
    if (!handRoom && !boardRoom) {
      if (player.isHuman) log('No room for golden triple — free a slot.');
      continue;
    }
    locs.sort((a, b) => {
      if (a.where !== b.where) return a.where === 'hand' ? -1 : 1;
      return b.index - a.index;
    });
    let atkBonus = 0;
    let hpBonus = 0;
    const keywordSet = new Set();
    for (const loc of locs) {
      const base = CARD_BY_ID[cardId];
      atkBonus += loc.m.attack - (base?.attack || loc.m.attack);
      hpBonus += loc.m.health - (base?.health || loc.m.health);
      loc.m.keywords.forEach(k => keywordSet.add(k));
    }
    for (const loc of locs) {
      const arr = loc.where === 'board' ? player.board : player.hand;
      const i = arr.findIndex(x => x && x.instanceId === loc.m.instanceId);
      if (i >= 0) arr.splice(i, 1);
    }
    const golden = createMinionFromDef(CARD_BY_ID[cardId], { golden: true });
    buffMinion(golden, atkBonus, hpBonus);
    keywordSet.forEach(k => addKeyword(golden, k));
    golden.divineShield = golden.keywords.includes('DivineShield');
    golden.rebornActive = golden.keywords.includes('Reborn');
    if (player.hand.length < MAX_HAND) player.hand.push(golden);
    else player.board.push(golden);
    log(`${player.name} crafted Golden ${CARD_BY_ID[cardId].name}!`);
    const discoverTier = Math.min(6, player.tavernTier + 1);
    queueDiscover(player, discoverTier, true);
    return checkTriples(player);
  }
}

function runEffect(effect, ctx) {
  if (!effect) return;
  const fn = EFFECT_CATALOG[effect.id];
  if (!fn) return;
  fn(ctx, effect.params || {});
}

function applyHeroDamage(player, amount) {
  let dmg = amount;
  if (player.armor > 0) {
    const used = Math.min(player.armor, dmg);
    player.armor -= used;
    dmg -= used;
  }
  player.hp -= dmg;
  if (player.hp < 0) player.hp = 0;
  player.lastCombatDamage = (player.lastCombatDamage || 0) + amount;
}

function dealDamageToMinion(target, amount, ctx) {
  if (!target || target.health <= 0 || amount <= 0) return;
  if (target.divineShield || hasKeyword(target, 'DivineShield')) {
    target.divineShield = false;
    target.keywords = target.keywords.filter(k => k !== 'DivineShield');
    return;
  }
  target.health -= amount;
  if (target.health <= 0) killMinion(target, ctx);
}

function killMinion(minion, ctx) {
  const owner = ctx.friendly.board.includes(minion) ? ctx.friendly : ctx.enemy;
  if (!owner) return;
  const opponent = owner === ctx.friendly ? ctx.enemy : ctx.friendly;
  const board = owner.board;
  const idx = board.indexOf(minion);
  if (idx < 0) return;
  const avengeIds = board.filter(m => m !== minion && m.avenge).map(m => m.instanceId);
  board.splice(idx, 1);
  if (minion.deathrattle) {
    runEffect(minion.deathrattle, {
      friendly: owner,
      enemy: opponent,
      self: null,
      selfIndex: idx,
      inCombat: true
    });
  }
  let rebornId = null;
  if (minion.rebornActive || hasKeyword(minion, 'Reborn')) {
    if (board.length < MAX_BOARD) {
      const reborn = cloneMinion(minion, true);
      reborn.health = 1;
      reborn.maxHealth = 1;
      reborn.attack = minion.attack;
      reborn.keywords = minion.keywords.filter(k => k !== 'Reborn' && k !== 'DivineShield');
      reborn.rebornActive = false;
      reborn.divineShield = false;
      reborn.avenge = minion.avenge ? { count: minion.avenge.count, effect: { ...minion.avenge.effect, params: { ...minion.avenge.effect.params } }, progress: 0 } : null;
      reborn.attacksRemaining = hasKeyword(reborn, 'Windfury') ? 2 : 1;
      rebornId = reborn.instanceId;
      board.splice(Math.min(idx, board.length), 0, reborn);
    }
  }
  const pendingAvenge = [];
  for (const m of board) {
    if (!m.avenge) continue;
    if (m.instanceId === rebornId) continue;
    if (!avengeIds.includes(m.instanceId)) continue;
    m.avenge.progress = (m.avenge.progress || 0) + 1;
    if (m.avenge.progress >= m.avenge.count) {
      m.avenge.progress = 0;
      pendingAvenge.push(m);
    }
  }
  for (const m of pendingAvenge) {
    if (!board.includes(m) || m.health <= 0) continue;
    runEffect(m.avenge.effect, {
      friendly: owner,
      enemy: opponent,
      self: m,
      selfIndex: board.indexOf(m),
      inCombat: true
    });
  }
}

function getAttackTargets(attackerSide, defenderSide) {
  const taunts = defenderSide.board.filter(m => m.health > 0 && hasKeyword(m, 'Taunt'));
  if (taunts.length) return taunts;
  return defenderSide.board.filter(m => m.health > 0);
}

function popDivineShield(minion) {
  if (minion.divineShield || hasKeyword(minion, 'DivineShield')) {
    minion.divineShield = false;
    minion.keywords = minion.keywords.filter(k => k !== 'DivineShield');
    return true;
  }
  return false;
}

function minionAttack(attacker, attackerSide, defenderSide) {
  const targets = getAttackTargets(attackerSide, defenderSide);
  if (!targets.length || attacker.health <= 0 || attacker.attack <= 0) return;
  const target = pick(targets);
  const ctxA = { friendly: attackerSide, enemy: defenderSide, self: attacker, selfIndex: attackerSide.board.indexOf(attacker), inCombat: true };
  const ctxB = { friendly: defenderSide, enemy: attackerSide, self: target, selfIndex: defenderSide.board.indexOf(target), inCombat: true };
  const atkDmg = attacker.attack;
  const defDmg = target.attack;
  if (atkDmg > 0) {
    if (!popDivineShield(target)) {
      target.health -= atkDmg;
      if (hasKeyword(attacker, 'Poisonous')) target.health = 0;
    }
  }
  if (defDmg > 0) {
    if (!popDivineShield(attacker)) {
      attacker.health -= defDmg;
      if (hasKeyword(target, 'Poisonous')) attacker.health = 0;
    }
  }
  const attackerDies = attacker.health <= 0;
  const targetDies = target.health <= 0;
  if (attackerDies && targetDies) {
    const aIdx = attackerSide.board.indexOf(attacker);
    const bIdx = defenderSide.board.indexOf(target);
    if (aIdx >= 0) attackerSide.board.splice(aIdx, 1);
    if (bIdx >= 0) defenderSide.board.splice(bIdx, 1);
    const avengeA = attackerSide.board.filter(m => m.avenge).map(m => m.instanceId);
    const avengeB = defenderSide.board.filter(m => m.avenge).map(m => m.instanceId);
    if (attacker.deathrattle) runEffect(attacker.deathrattle, { friendly: attackerSide, enemy: defenderSide, self: null, selfIndex: aIdx, inCombat: true });
    if (target.deathrattle) runEffect(target.deathrattle, { friendly: defenderSide, enemy: attackerSide, self: null, selfIndex: bIdx, inCombat: true });
    const skipA = spawnReborn(attacker, attackerSide, aIdx);
    const skipB = spawnReborn(target, defenderSide, bIdx);
    applyAvengeForDeath(attackerSide, defenderSide, avengeA, skipA);
    applyAvengeForDeath(defenderSide, attackerSide, avengeB, skipB);
  } else {
    if (attackerDies) killMinion(attacker, ctxA);
    if (targetDies) killMinion(target, ctxB);
  }
}

function spawnReborn(minion, side, idx) {
  if (!(minion.rebornActive || hasKeyword(minion, 'Reborn'))) return null;
  if (side.board.length >= MAX_BOARD) return null;
  const reborn = cloneMinion(minion, true);
  reborn.health = 1;
  reborn.maxHealth = 1;
  reborn.attack = minion.attack;
  reborn.keywords = minion.keywords.filter(k => k !== 'Reborn' && k !== 'DivineShield');
  reborn.rebornActive = false;
  reborn.divineShield = false;
  reborn.avenge = minion.avenge ? { count: minion.avenge.count, effect: { ...minion.avenge.effect, params: { ...minion.avenge.effect.params } }, progress: 0 } : null;
  reborn.attacksRemaining = hasKeyword(reborn, 'Windfury') ? 2 : 1;
  side.board.splice(Math.min(Math.max(idx, 0), side.board.length), 0, reborn);
  return reborn.instanceId;
}

function applyAvengeForDeath(owner, opponent, avengeIds, skipId) {
  const pending = [];
  for (const m of owner.board) {
    if (!m.avenge) continue;
    if (skipId && m.instanceId === skipId) continue;
    if (!avengeIds.includes(m.instanceId)) continue;
    m.avenge.progress = (m.avenge.progress || 0) + 1;
    if (m.avenge.progress >= m.avenge.count) {
      m.avenge.progress = 0;
      pending.push(m);
    }
  }
  for (const m of pending) {
    if (!owner.board.includes(m) || m.health <= 0) continue;
    runEffect(m.avenge.effect, {
      friendly: owner,
      enemy: opponent,
      self: m,
      selfIndex: owner.board.indexOf(m),
      inCombat: true
    });
  }
}

function snapshotSides(sideA, sideB) {
  return { boardA: cloneBoard(sideA.board), boardB: cloneBoard(sideB.board) };
}

function resolveCombat(playerA, playerB) {
  const sideA = { ...playerA, board: cloneBoard(playerA.board), isCombatClone: true };
  const sideB = { ...playerB, board: cloneBoard(playerB.board), isCombatClone: true };
  sideA.board.forEach(m => { m.divineShield = hasKeyword(m, 'DivineShield'); m.rebornActive = hasKeyword(m, 'Reborn'); if (m.avenge) m.avenge.progress = 0; });
  sideB.board.forEach(m => { m.divineShield = hasKeyword(m, 'DivineShield'); m.rebornActive = hasKeyword(m, 'Reborn'); if (m.avenge) m.avenge.progress = 0; });

  const frames = [];
  const pushFrame = (text, attackerId = null) => {
    frames.push({ text, attackerId, ...snapshotSides(sideA, sideB) });
  };

  for (const m of [...sideA.board]) {
    if (m.startOfCombat) runEffect(m.startOfCombat, { friendly: sideA, enemy: sideB, self: m, selfIndex: sideA.board.indexOf(m), inCombat: true });
  }
  for (const m of [...sideB.board]) {
    if (m.startOfCombat) runEffect(m.startOfCombat, { friendly: sideB, enemy: sideA, self: m, selfIndex: sideB.board.indexOf(m), inCombat: true });
  }
  pushFrame('Start of Combat');

  const prepareAttacks = (side) => {
    side.board.forEach(m => { m.attacksRemaining = hasKeyword(m, 'Windfury') ? 2 : 1; });
    side.nextAttackIndex = 0;
  };
  prepareAttacks(sideA);
  prepareAttacks(sideB);
  let aFirst = sideA.board.length > sideB.board.length ? true : sideA.board.length < sideB.board.length ? false : Math.random() < 0.5;
  let guard = 200;

  const chooseAttacker = (side) => {
    if (!side.board.length) return null;
    if (!side.board.some(m => m.health > 0 && m.attack > 0 && (m.attacksRemaining || 0) > 0)) {
      prepareAttacks(side);
    }
    let tries = side.board.length * 2;
    while (tries-- > 0) {
      if (side.nextAttackIndex >= side.board.length) side.nextAttackIndex = 0;
      const m = side.board[side.nextAttackIndex];
      side.nextAttackIndex++;
      if (m && m.health > 0 && m.attack > 0 && (m.attacksRemaining || 0) > 0) return m;
    }
    return null;
  };

  while (guard-- > 0 && sideA.board.some(m => m.health > 0) && sideB.board.some(m => m.health > 0)) {
    const active = aFirst ? sideA : sideB;
    const other = aFirst ? sideB : sideA;
    const attacker = chooseAttacker(active);
    if (!attacker) {
      aFirst = !aFirst;
      continue;
    }
    const sideName = aFirst ? playerA.name : playerB.name;
    const strikes = Math.max(1, attacker.attacksRemaining || 1);
    for (let s = 0; s < strikes; s++) {
      if (attacker.health <= 0 || !active.board.includes(attacker)) break;
      if (!other.board.some(m => m.health > 0)) break;
      attacker.attacksRemaining = Math.max(0, (attacker.attacksRemaining || 1) - 1);
      minionAttack(attacker, active, other);
      pushFrame(`${sideName}: ${attacker.name} attacks`, attacker.instanceId);
    }
    aFirst = !aFirst;
  }

  const aAlive = sideA.board.filter(m => m.health > 0);
  const bAlive = sideB.board.filter(m => m.health > 0);
  let winner = null;
  let loser = null;
  let damage = 0;
  if (aAlive.length && !bAlive.length) {
    winner = playerA; loser = playerB;
    damage = playerA.tavernTier + aAlive.reduce((s, m) => s + m.tier, 0);
    pushFrame(`${playerA.name} wins · ${damage} damage`);
  } else if (bAlive.length && !aAlive.length) {
    winner = playerB; loser = playerA;
    damage = playerB.tavernTier + bAlive.reduce((s, m) => s + m.tier, 0);
    pushFrame(`${playerB.name} wins · ${damage} damage`);
  } else {
    pushFrame('Tie');
  }
  return { winner, loser, damage, frames, sideA, sideB };
}

function heroPowerHasTarget(player) {
  const power = player.hero.power;
  const id = power.effect?.id;
  if (power.special === 'leftmost') return player.board.length > 0;
  if (id === 'buffRandomFriendly' || id === 'giveKeywordFriendly') return player.board.length > 0;
  if (id === 'buffFriendlyTribe') return player.board.some(m => m.tribe === power.effect.params.tribe);
  if (id === 'discoverCurrentTier') return player.hand.length < MAX_HAND;
  return true;
}

function useHeroPower(player) {
  if (player.heroPowerUses <= 0) return false;
  const power = player.hero.power;
  if (player.gold < power.cost) return false;
  if (!heroPowerHasTarget(player)) {
    if (player.isHuman) log('No valid target for Lord power.');
    return false;
  }
  player.gold -= power.cost;
  player.heroPowerUses--;
  if (power.special === 'leftmost') {
    buffMinion(player.board[0], 1, 2);
  } else {
    runEffect(power.effect, { friendly: player, enemy: null, self: null, selfIndex: -1, inCombat: false });
  }
  log(`${player.name} used ${power.name}.`);
  return true;
}

function createPlayer(hero, isHuman, index) {
  return {
    id: index,
    name: isHuman ? 'You' : `AI ${index}`,
    isHuman,
    hero,
    hp: START_HP,
    maxHp: START_HP,
    armor: hero.armor,
    gold: 0,
    tavernTier: 1,
    upgradeCost: UPGRADE_BASE[2],
    shop: [],
    hand: [],
    board: [],
    frozen: false,
    heroPowerUses: 0,
    alive: true,
    placement: null,
    lastCombatBoard: []
  };
}

function aiChooseHero(options) {
  return options.slice().sort((a, b) => b.armor - a.armor)[0];
}

function aiRecruit(player) {
  let safety = 40;
  while (safety-- > 0) {
    if (player.tavernTier < 6 && player.gold >= player.upgradeCost && player.gold - player.upgradeCost >= 3) {
      upgradeTavern(player);
      continue;
    }
    if (player.heroPowerUses > 0 && player.gold >= player.hero.power.cost && heroPowerHasTarget(player)) {
      if (Math.random() < 0.55 && useHeroPower(player)) continue;
    }
    const tribeCounts = {};
    player.board.forEach(m => { tribeCounts[m.tribe] = (tribeCounts[m.tribe] || 0) + 1; });
    player.hand.forEach(m => { tribeCounts[m.tribe] = (tribeCounts[m.tribe] || 0) + 1; });
    const mainTribe = Object.keys(tribeCounts).sort((a, b) => tribeCounts[b] - tribeCounts[a])[0];
    let bestIdx = -1;
    let bestScore = -999;
    player.shop.forEach((m, i) => {
      if (!m) return;
      let score = 0;
      if (isSpell(m)) {
        score = 6 + m.tier * 2 - m.cost;
        if (m.effect?.id === 'gainGold' || m.effect?.id === 'buffFriendlyAll') score += 3;
        if (player.gold < m.cost) score = -999;
      } else {
        score = m.attack + m.health + m.tier * 2;
        if (m.tribe === mainTribe) score += 4;
        const owned = [...player.board, ...player.hand].filter(x => !isSpell(x) && x.cardId === m.cardId && !x.golden).length;
        if (owned === 2) score += 12;
        if (owned === 1) score += 3;
      }
      if (score > bestScore) { bestScore = score; bestIdx = i; }
    });
    if (bestIdx >= 0) {
      const offer = player.shop[bestIdx];
      if (!isSpell(offer)) {
        const owned = [...player.board, ...player.hand].filter(x => !isSpell(x) && x.cardId === offer.cardId && !x.golden).length;
        if (owned === 2 && (player.gold < BUY_COST || player.hand.length >= MAX_HAND)) {
          player.frozen = true;
          break;
        }
      }
      const price = isSpell(offer) ? offer.cost : BUY_COST;
      if (player.gold >= price && player.hand.length < MAX_HAND && bestScore > -100) {
        buyFromShop(player, bestIdx, true);
        continue;
      }
    }
    const spellHand = player.hand.findIndex(isSpell);
    if (spellHand >= 0 && playSpell(player, spellHand, true)) continue;
    while (player.hand.some(c => !isSpell(c)) && player.board.length < MAX_BOARD) {
      const idx = player.hand.findIndex(c => !isSpell(c));
      if (idx < 0) break;
      playMinion(player, idx, player.board.length, true);
    }
    if (player.board.length >= MAX_BOARD && player.gold >= BUY_COST) {
      const weakIdx = player.board.reduce((wi, m, i, arr) => (m.attack + m.health < arr[wi].attack + arr[wi].health ? i : wi), 0);
      if (player.board[weakIdx] && mainTribe && player.board[weakIdx].tribe !== mainTribe) {
        sellMinion(player, 'board', weakIdx);
        continue;
      }
    }
    if (player.gold >= REFRESH_COST && player.tavernTier >= 2 && Math.random() < 0.35) {
      refreshShop(player);
      continue;
    }
    break;
  }
  while (player.hand.some(c => !isSpell(c)) && player.board.length < MAX_BOARD) {
    const idx = player.hand.findIndex(c => !isSpell(c));
    if (idx < 0) break;
    playMinion(player, idx, player.board.length, true);
  }
  for (let i = player.hand.length - 1; i >= 0; i--) {
    if (isSpell(player.hand[i])) playSpell(player, i, true);
  }
}

function pairPlayers(alive) {
  const shuffled = alive.slice().sort(() => Math.random() - 0.5);
  const pairs = [];
  const ghosts = [];
  for (let i = 0; i < shuffled.length; i += 2) {
    if (i + 1 < shuffled.length) pairs.push([shuffled[i], shuffled[i + 1]]);
    else ghosts.push(shuffled[i]);
  }
  return { pairs, ghosts };
}

function applyCombatResult(result, a, b, { silent = false } = {}) {
  if (a && a.lastCombatBoard !== undefined) a.lastCombatBoard = cloneBoard(a.board);
  if (b && b.lastCombatBoard !== undefined) b.lastCombatBoard = cloneBoard(b.board);
  if (result.winner && result.loser) {
    applyHeroDamage(result.loser, result.damage);
    if (!silent) log(`${result.winner.name} hits ${result.loser.name} for ${result.damage}.`);
  } else if (!silent) {
    log(`${a.name} tied with ${b?.name || 'Ghost'}.`);
  }
}

function buildGhostOpponent(exclude, alive) {
  const donor = pick(alive.filter(p => p !== exclude && p.lastCombatBoard && p.lastCombatBoard.length)) || pick(alive.filter(p => p !== exclude)) || exclude;
  return {
    id: -1,
    name: `Ghost ${donor.hero?.name || donor.name}`,
    hero: donor.hero,
    tavernTier: donor.tavernTier,
    board: cloneBoard(donor.lastCombatBoard.length ? donor.lastCombatBoard : donor.board),
    isHuman: false
  };
}

async function runCombatPhase() {
  phase = 'combat';
  log('Preparing for battle...');
  setControlsEnabled(false);
  closePeek();
  hideOppHover();
  for (const p of state.players) p.lastCombatDamage = 0;
  syncUI();
  renderCards();
  await sleep(300);

  const alive = state.players.filter(p => p.alive);
  const { pairs, ghosts } = pairPlayers(alive);
  const you = alive.find(p => p.isHuman) || null;
  let yourFight = null;
  const otherFights = [];

  for (const [a, b] of pairs) {
    if (you && (a.id === you.id || b.id === you.id)) {
      yourFight = { type: 'pair', a, b };
    } else {
      otherFights.push({ type: 'pair', a, b });
    }
  }
  for (const g of ghosts) {
    if (you && g.id === you.id) yourFight = { type: 'ghost', a: g };
    else otherFights.push({ type: 'ghost', a: g });
  }

  for (const fight of otherFights) {
    if (fight.type === 'pair') {
      const result = resolveCombat(fight.a, fight.b);
      applyCombatResult(result, fight.a, fight.b, { silent: true });
    } else {
      const ghostPlayer = buildGhostOpponent(fight.a, alive);
      const result = resolveCombat(fight.a, ghostPlayer);
      fight.a.lastCombatBoard = cloneBoard(fight.a.board);
      if (result.loser === fight.a) applyHeroDamage(fight.a, result.damage);
    }
  }

  if (yourFight && you) {
    if (yourFight.type === 'pair') {
      const foe = yourFight.a.isHuman || yourFight.a.id === you.id ? yourFight.b : yourFight.a;
      const left = yourFight.a.isHuman || yourFight.a.id === you.id ? yourFight.a : yourFight.b;
      const right = foe;
      highlightCombat(left, right);
      await playVisibleCombat(left, right);
      const result = resolveCombat(left, right);
      await animateCombat(result, left, right);
      applyCombatResult(result, left, right, { silent: true });
    } else {
      const ghostPlayer = buildGhostOpponent(you, alive);
      highlightCombat(you, null);
      await playVisibleCombat(you, ghostPlayer);
      const result = resolveCombat(you, ghostPlayer);
      await animateCombat(result, you, ghostPlayer);
      you.lastCombatBoard = cloneBoard(you.board);
      if (result.loser === you) {
        applyHeroDamage(you, result.damage);
      }
    }
  } else {
    log('No player combat found this round.');
  }

  combatAnim = null;
  renderCards();

  const newlyDead = state.players
    .filter(p => p.alive && p.hp <= 0)
    .sort((a, b) => (b.lastCombatDamage - a.lastCombatDamage) || (a.armor - b.armor) || (a.id - b.id));
  let nextPlace = 8 - state.players.filter(p => !p.alive).length;
  for (const p of newlyDead) {
    p.alive = false;
    p.hp = 0;
    p.placement = nextPlace;
    nextPlace++;
    for (const m of [...p.board, ...p.hand, ...p.shop]) if (m) returnToPool(m);
    p.board = []; p.hand = []; p.shop = [];
    log(`${p.name} was eliminated! (#${p.placement})`);
  }
  const stillAlive = state.players.filter(p => p.alive);
  const humanPlayer = human();
  if (stillAlive.length <= 1) {
    endMatch(stillAlive[0] || null);
    return;
  }
  if (humanPlayer && !humanPlayer.alive) {
    endMatch(null);
    return;
  }
  await sleep(400);
  state.turn++;
  beginRecruitPhase();
}

function highlightCombat(a, b) {
  syncOpponents(a?.id, b?.id);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function playVisibleCombat(player, enemy) {
  const foeName = enemy.hero?.name || enemy.name;
  phase = 'combat';
  combatAnim = {
    a: player,
    b: enemy,
    t: 0,
    attackerId: null,
    boardA: cloneBoard(player.board),
    boardB: cloneBoard(enemy.board || [])
  };
  log(`You vs ${foeName}`);
  log('Battle begins!');
  syncHeroPortraits();
  renderCards();
  await sleep(1100);
}

async function animateCombat(result, a, b) {
  phase = 'combat';
  const frames = result.frames?.length ? result.frames : [{
    text: 'Combat',
    boardA: cloneBoard(result.sideA?.board || a.board || []),
    boardB: cloneBoard(result.sideB?.board || b.board || [])
  }];
  for (let i = 0; i < frames.length; i++) {
    const frame = frames[i];
    combatAnim = {
      a,
      b,
      t: 0,
      frame,
      attackerId: frame.attackerId,
      boardA: frame.boardA || [],
      boardB: frame.boardB || []
    };
    if (frame.text) log(frame.text);
    syncHeroPortraits();
    renderCards();
    await sleep(i === 0 ? 700 : 850);
  }
  await sleep(500);
  combatAnim = null;
}

function endMatch(winner) {
  phase = 'end';
  setControlsEnabled(false);
  const humanPlayer = state.players.find(p => p.isHuman);
  const place = winner?.isHuman ? 1 : (humanPlayer?.placement || (state.players.filter(p => p.alive || p === humanPlayer).length));
  let summary = 'No survivors.';
  if (winner?.isHuman) summary = `${winner.name} wins the lobby.`;
  else if (humanPlayer?.placement) summary = `You placed #${humanPlayer.placement}.`;
  else if (winner) summary = `${winner.name} wins the lobby.`;
  const box = document.getElementById('overlayContent');
  document.getElementById('overlay').classList.remove('hidden');
  setGameUiVisible(false);
  box.innerHTML = `<h1>${winner?.isHuman ? 'Victory!' : 'Defeat'}</h1>
    <p>${summary}<br>Your placement: #${winner?.isHuman ? 1 : humanPlayer?.placement || place}</p>
    <button class="primary" id="btnAgain">Play Again</button>`;
  document.getElementById('btnAgain').onclick = () => showTitleScreen();
}

function beginRecruitPhase() {
  phase = 'recruit';
  const visitGold = getTavernGoldForTurn(state.turn);
  for (const p of state.players) {
    if (!p.alive) continue;
    startRecruitForPlayer(p);
  }
  selected = null;
  const you = human();
  setControlsEnabled(!!(you && you.alive));
  syncUI();
  renderCards();
  if (you && you.alive) log(`Turn ${state.turn}: Tavern visit — gold set to ${you.gold}.`);
  else log(`Turn ${state.turn}: Tavern visit — gold set to ${visitGold}.`);
}

function setControlsEnabled(on) {
  const you = human();
  const canAct = !!on && phase === 'recruit' && !!(you && you.alive);
  ['btnRefresh', 'btnUpgrade', 'btnFreeze', 'btnHeroPower', 'btnEnd'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = !canAct;
  });
}

function human() { return state.players.find(p => p.isHuman); }

function closePeek() {
  peekPlayerId = null;
  document.getElementById('peekPanel').classList.remove('show');
  syncOpponents();
}

function openPeek(player) {
  if (!player || !player.alive) return;
  peekPlayerId = player.id;
  const panel = document.getElementById('peekPanel');
  panel.classList.add('show');
  document.getElementById('peekTitle').textContent = player.isHuman ? 'Your Board' : player.hero.name;
  document.getElementById('peekMeta').textContent = `HP ${player.hp}${player.armor ? ` · Armor ${player.armor}` : ''} · Tier ${player.tavernTier} · ${player.board.length}/7 minions`;
  const list = document.getElementById('peekList');
  if (!player.board.length) {
    list.innerHTML = '<div class="peekMinion"><div class="title">Empty board</div></div>';
  } else {
    list.innerHTML = player.board.map((m, i) => {
      return `<div class="peekMinion"><div class="title">${i + 1}. ${m.name}</div><div class="stats">${m.attack}/${m.health} · T${m.tier} ${m.tribe}${m.golden ? ' · Golden' : ''}</div><div class="text">${describeMinion(m)}</div></div>`;
    }).join('');
  }
  syncOpponents();
}

function heroPortraitArt(hero) {
  const idx = Math.max(0, HERO_DB.findIndex(h => h.id === hero.id));
  return idx % 2 === 0 ? ART_A : ART_B;
}

function getCombatEnemy() {
  if (!combatAnim) return null;
  const you = human();
  if (!you) return null;
  if (combatAnim.a && (combatAnim.a.isHuman || combatAnim.a.id === you.id)) return combatAnim.b || null;
  if (combatAnim.b && (combatAnim.b.isHuman || combatAnim.b.id === you.id)) return combatAnim.a || null;
  return combatAnim.b || combatAnim.a || null;
}

function setGameUiVisible(visible) {
  document.getElementById('ui').classList.toggle('hidden', !visible);
  document.getElementById('playerPortraitSlot').classList.toggle('hidden', !visible);
  if (!visible) {
    hideHandOverlay();
    hideEnemyHandOverlay();
    hideOppHover();
  }
}

function syncHeroPortraits() {
  const p = human();
  const bobFrame = document.getElementById('tavernMasterFrame');
  const enemyFrame = document.getElementById('combatEnemyFrame');
  if (!p) {
    bobFrame.classList.remove('show');
    enemyFrame.classList.remove('show');
    return;
  }
  document.getElementById('playerHeroArt').src = heroPortraitArt(p.hero);
  document.getElementById('playerHeroArt').alt = p.hero.name;
  document.getElementById('tavernMasterArt').src = ART_B;
  const showBob = phase === 'recruit';
  const enemy = getCombatEnemy();
  const showEnemy = phase === 'combat' && !!enemy;
  bobFrame.classList.toggle('show', showBob);
  enemyFrame.classList.toggle('show', showEnemy);
  if (showEnemy) {
    const name = enemy.hero?.name || enemy.name || 'Enemy';
    document.getElementById('combatEnemyArt').src = enemy.hero ? heroPortraitArt(enemy.hero) : ART_A;
    document.getElementById('combatEnemyArt').alt = name;
  }
  if (!showBob && !showEnemy) hideOppHover();
}

function syncUI() {
  const p = human();
  if (!p) return;
  document.getElementById('goldVal').textContent = p.gold;

function positionOppHover(clientX, clientY) {
  const tip = document.getElementById('oppHover');

  const tw = tip.offsetWidth || 240;
  const th = tip.offsetHeight || 160;
  let left = clientX + 18;
  let top = clientY - 20;
  if (left + tw > window.innerWidth - pad) left = clientX - tw - 18;
  if (top + th > window.innerHeight - pad) top = window.innerHeight - th - pad;
  if (top < pad) top = pad;
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}

function syncOpponents(combatA, combatB) {
  const el = document.getElementById('opponents');
  if (!state) {
    el.innerHTML = '';
    hideOppHover();
    return;
  }
  const ranked = state.players.slice().sort((a, b) => {
    const aliveDiff = Number(b.alive) - Number(a.alive);
    if (aliveDiff) return aliveDiff;
    const hpDiff = heroEffectiveHp(b) - heroEffectiveHp(a);
    if (hpDiff) return hpDiff;
    return a.id - b.id;
  });
  el.innerHTML = ranked.map((p, i) => {
    const rank = i + 1;
    const cls = ['opp'];
    if (!p.alive) cls.push('dead');
    if (p.isHuman) cls.push('self');
    if (p.id === combatA || p.id === combatB) cls.push('combat');
    if (p.id === peekPlayerId) cls.push('peeking');
    const art = heroPortraitArt(p.hero);
    const name = p.isHuman ? 'You' : p.hero.name;
    const maxPool = Math.max(1, (p.maxHp || START_HP) + (p.hero?.armor || 0));
    const hpPct = p.alive ? clamp((heroEffectiveHp(p) / maxPool) * 100, 0, 100) : 0;
    const rankHtml = rank <= 3 ? `<div class="rank">#${rank}</div>` : '';
    return `<div class="${cls.join(' ')}" data-pid="${p.id}" data-rank="${rank}" title="">
      <img class="portrait" src="${art}" alt="${name}">
      ${rankHtml}
      <div class="hpBar"><div class="hpBarFill" style="width:${hpPct.toFixed(1)}%"></div></div>
    </div>`;
  }).join('');
  el.querySelectorAll('.opp').forEach(node => {
    const pid = Number(node.getAttribute('data-pid'));
    const rank = Number(node.getAttribute('data-rank'));
    const player = state.players.find(x => x.id === pid);
    if (!player) return;
    node.onmouseenter = (e) => showOppHover(player, rank, e.clientX, e.clientY);
    node.onmousemove = (e) => {
      if (document.getElementById('oppHover').classList.contains('show')) {
        positionOppHover(e.clientX, e.clientY);
      }
    };
    node.onmouseleave = () => hideOppHover();
    node.onclick = () => {
      if (phase !== 'recruit' && phase !== 'combat') return;
      if (peekPlayerId === pid) closePeek();
      else openPeek(player);
    };
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();

  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function frameColors(card, opts = {}) {
  const frozenShop = !!opts.frozenShop;

  if (frozenShop) frameHex = '#6ec6ff';
  if (opts.isSelected) frameHex = '#7ad0ff';
